name: Validate static tutorial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate file graph and SVG XML
        run: python scripts/check_site.py
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/tutorial-server.log 2>&1 &
          echo $! > /tmp/tutorial-server.pid
      - name: Desktop and mobile smoke checks
        run: python scripts/browser_smoke.py http://127.0.0.1:8000
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-011-browser-qa
          path: reports/browser-qa/
          if-no-files-found: ignore
