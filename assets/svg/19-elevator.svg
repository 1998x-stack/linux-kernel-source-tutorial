<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">电梯式插队：cmd、dev、sector 的词典序</title><desc id="svg-desc">IN_ORDER 比较的是三元组；链表只在一个逆序断点处允许“折返”，不是合并相邻扇区。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:12px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">电梯式插队：cmd、dev、sector 的词典序</text><text x="30" y="71" class="subtitle">IN_ORDER 比较的是三元组；链表只在一个逆序断点处允许“折返”，不是合并相邻扇区。</text>
<rect x="36" y="113" width="205" height="89" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="50" y="143" class="node">request A</text><text x="50" y="167" class="detail">READ, dev=3, sector=12</text>
<path d="M241 155L270 155" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="274" y="113" width="210" height="89" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="288" y="143" class="node">request B</text><text x="288" y="167" class="detail">READ, dev=3, sector=40</text>
<path d="M484 155L513 155" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="517" y="113" width="191" height="89" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="531" y="143" class="node">request C</text><text x="531" y="167" class="detail">WRITE, dev=3, 8</text>
<path d="M708 155L737 155" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="741" y="113" width="191" height="89" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="755" y="143" class="node">request D</text><text x="755" y="167" class="detail">WRITE, dev=3, 20</text>
<path d="M403 202V249H548V271" fill="none" stroke="#ba6543" stroke-width="2.5" marker-end="url(#b)"/>
<rect x="339" y="277" width="444" height="90" rx="12" fill="#fff4ee" stroke="#ba6543" stroke-width="1.6"/><text x="353" y="307" class="node">新 READ, dev=3, sector=24</text><text x="353" y="331" class="detail">按 IN_ORDER 插在 B 前；不会自动聚合请求</text>
<text x="37" y="416" class="detail">实际 add_request 会处理环绕排序点；图示为一种示意队列，不是实时磁盘调度日志。</text></svg>
