<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">sys_hello：用户态 int 0x80 到 sched.c 的函数表</title><desc id="svg-desc">Linux 0.11 用 EAX 选择系统调用号，EBX/ECX/EDX 传前三个参数；表在 include/linux/sys.h，由 sched.c 编译进内核。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b75e3f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.sub{font-size:14px;fill:#647879}.node{font-size:16px;font-weight:720}.detail{font-size:13px;fill:#566c70}.tiny{font-size:11.5px;fill:#6a7d7f}.line{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#arr)}.warnline{fill:none;stroke:#b75e3f;stroke-width:2.5;marker-end:url(#warn)}.teal{fill:#eef8f5;stroke:#147f80;stroke-width:1.6}.sand{fill:#fff4ed;stroke:#b75e3f;stroke-width:1.6}.slate{fill:#f2f5f6;stroke:#789094;stroke-width:1.4}</style><rect width="960" height="475" rx="16" fill="#fffdfa"/><text x="30" y="43" class="title">sys_hello：用户态 int 0x80 到 sched.c 的函数表</text><text x="30" y="69" class="sub">Linux 0.11 用 EAX 选择系统调用号，EBX/ECX/EDX 传前三个参数；表在 include/linux/sys.h，由 sched.c 编译进内核。</text>
<rect x="32" y="114" width="170" height="84" rx="12" class="teal"/><text x="46" y="141" class="node">用户程序</text><text x="46" y="163" class="detail">hello() wrapper</text>
<path d="M202 156L234 156" class="line"/>
<rect x="238" y="114" width="170" height="84" rx="12" class="teal"/><text x="252" y="141" class="node">EAX = 72</text><text x="252" y="163" class="detail">int $0x80</text>
<path d="M408 156L440 156" class="line"/>
<rect x="444" y="114" width="172" height="84" rx="12" class="teal"/><text x="458" y="141" class="node">IDT[0x80]</text><text x="458" y="163" class="detail">system_call gate</text>
<path d="M616 156L648 156" class="line"/>
<rect x="652" y="114" width="276" height="84" rx="12" class="teal"/><text x="666" y="141" class="node">system_call.s</text><text x="666" y="163" class="detail">边界检查 + 保存 EBX/ECX/EDX</text>
<path d="M790 198V250H481V277" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="285" y="281" width="392" height="84" rx="12" class="teal"/><text x="299" y="308" class="node">sys_call_table[72]</text><text x="299" y="330" class="detail">include/linux/sys.h → sched.c</text>
<path d="M677 323L711 323" class="line"/>
<rect x="715" y="281" width="213" height="84" rx="12" class="teal"/><text x="729" y="308" class="node">sys_hello()</text><text x="729" y="330" class="detail">kernel/sys.c</text>
<text x="36" y="414" class="detail">返回 EAX=0 → ret_from_system_call → 用户 wrapper；若返回负值，_syscall0 设置 errno 并返回 -1。</text>
<text x="36" y="443" class="tiny">三个位置必须同步：unistd.h 编号 72；sys.h 声明/表项；system_call.s 的 nr_system_calls 从 72 改 73。</text></svg>
