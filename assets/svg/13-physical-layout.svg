<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 物理内存和 mem_map 的管理范围</title><desc id="desc">低 1MiB 不走 mem_map，mem_map 管 1MiB 到最多 16MiB 的 4KiB 页框，buffer 区与可分配主内存边界随 RAM 调整</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">为什么前 1 MiB 没有 mem_map 条目？</text><text x="30" y="79" class="detail">LOW_MEM = 0x100000，PAGING_MEMORY = 15MiB，4096 字节每页。</text>
<rect x="39" y="121" width="280" height="95" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="53" y="154">0–1 MiB：低端内存</text><text class="detail" x="53" y="181">内核/设备窗口/缓冲区</text>
<path d="M319 169L350 169" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="352" y="121" width="265" height="95" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="366" y="154">1MiB–HIGH_MEMORY</text><text class="detail" x="366" y="181">受 mem_map 管控物理页</text>
<path d="M617 169L646 169" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="648" y="121" width="274" height="95" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="662" y="154">最高 16 MiB</text><text class="detail" x="662" y="181">PAGING_PAGES = 3840</text>
<rect x="40" y="271" width="880" height="99" rx="12" fill="#eef7f3" stroke="#147f80"/>
<rect x="40" y="271" width="305" height="99" rx="12" fill="#fff1e9" stroke="#bc6949"/>
<text x="59" y="303" class="node">内核 / 缓冲区</text><text x="59" y="332" class="detail">并非可分配页</text>
<text x="369" y="303" class="node">主内存可分配范围：start_mem → HIGH_MEMORY</text><text x="369" y="332" class="detail">mem_init 将这段对应的 mem_map 字节置 0</text>
<text x="40" y="418" class="detail">注意：图示区段不是按真实内存字节比例绘制；起点由实际 buffer_memory_end 等决定。</text></svg>
