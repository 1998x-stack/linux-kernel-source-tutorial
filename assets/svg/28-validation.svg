<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><title>三层项目验收</title><desc>Host reference model、Linux 0.11 guest block-device test、现代 procfs module test 分别验证不同边界</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="480" rx="20"/>
<text class="head" x="40" y="45">三种运行环境，三种不同的证明</text>
<rect class="teal" x="55" y="110" width="250" height="112" rx="14"/><text class="label" x="180" y="141" text-anchor="middle">Host Python model</text><text class="small" x="180" y="167" text-anchor="middle">sector range arithmetic</text>
<rect class="gold" x="355" y="110" width="250" height="112" rx="14"/><text class="label" x="480" y="141" text-anchor="middle">Linux 0.11 guest</text><text class="small" x="480" y="167" text-anchor="middle">/dev/ram1 read/write</text>
<rect class="violet" x="655" y="110" width="250" height="112" rx="14"/><text class="label" x="780" y="141" text-anchor="middle">Modern Linux VM</text><text class="small" x="780" y="167" text-anchor="middle">proc_ops load/read/unload</text>
<path class="line" d="M180 222V280H480"/><path class="line" d="M480 222V280"/><path class="line" d="M780 222V280H480"/>
<rect class="panel" x="305" y="300" width="350" height="92" rx="14"/><text class="label" x="480" y="331" text-anchor="middle">Evidence bundle</text><text class="small" x="480" y="357" text-anchor="middle">commands · output · kernel version · logs</text>
<text class="small" x="480" y="440" text-anchor="middle">任何一层 PASS 都不能冒充另外两层的集成验证</text></svg>