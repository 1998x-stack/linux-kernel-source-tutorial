<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">信号递送是异步提出请求并在适合的返回点处理</title><desc id="desc">位图发送后不是立刻运行 handler，返回用户态时按 pending 与 blocked 的交集选出可递送信号</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">发送、待处理、递送：三个不同的时刻</text><text x="30" y="79" class="detail">signal 位图只存 pending；真正执行 handler 发生在用户态返回路径被改写时。</text>
<rect x="30" y="118" width="216" height="92" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="44" y="151">send_sig / kill</text><text class="detail" x="44" y="178">signal |= 1 &amp;lt;&amp;lt; (sig-1)</text>
<path d="M246 164L274 164" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="276" y="118" width="243" height="92" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="290" y="151">pending / blocked</text><text class="detail" x="290" y="178">mask = signal &amp;amp; ~blocked</text>
<path d="M519 164L547 164" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="549" y="118" width="377" height="92" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="563" y="151">ret_from_sys_call</text><text class="detail" x="563" y="178">检查 task 0 / 用户 CS/SS / 位图</text>
<path d="M718 210V264H460V279" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#teal)"/>
<rect x="281" y="281" width="359" height="83" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="295" y="314">do_signal(signr)</text><text class="detail" x="295" y="341">忽略 / 默认动作 / 用户 handler</text>
<text x="30" y="414" class="detail">定时器与系统调用返回路径执行信号识别；不是任意 IRQ 都立即运行用户处理器。</text></svg>
