<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Linux 0.11 schedule 的 counter 选择与重算</title><desc id="chart-desc">扫描只选 TASK_RUNNING 的最大 counter；所有可运行任务 counter 均为零时按一半旧值加 priority 重新计算，再扫描</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">选谁运行？不是“优先级大就立即抢占”</text><text x="34" y="78" class="detail">schedule() 在 TASK_RUNNING 任务中选最大 counter，全部耗尽才重算。</text>
<rect x="70" y="119" width="257" height="105" rx="11" fill="#e5f4ee" stroke="#147f80"/><text x="87" y="155" class="node">task A</text><text x="87" y="184" class="mono">priority=12</text><text x="87" y="208" class="detail">counter=5</text><rect x="365" y="119" width="257" height="105" rx="11" fill="#f4f6f5" stroke="#c6d8d2"/><text x="382" y="155" class="node">task B</text><text x="382" y="184" class="mono">priority=7</text><text x="382" y="208" class="detail">counter=3</text><rect x="660" y="119" width="257" height="105" rx="11" fill="#f4f6f5" stroke="#c6d8d2"/><text x="677" y="155" class="node">task C</text><text x="677" y="184" class="mono">priority=2</text><text x="677" y="208" class="detail">counter=0</text>
<text x="70" y="263" class="em">本轮选择 A：5 &gt; 3 &gt; 0（仅假设三个 task 均处于 TASK_RUNNING）</text>
<rect x="70" y="286" width="817" height="103" rx="11" class="band"/><text x="90" y="319" class="node">当所有可运行任务的 counter = 0：</text>
<text x="90" y="352" class="mono">new_counter = (old_counter &gt;&gt; 1) + priority</text>
<text x="90" y="373" class="mini">重算遍历所有已存在的非 task 0 任务，不只当前可运行集合；随后重新选择。</text></svg>
