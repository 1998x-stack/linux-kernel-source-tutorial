<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">进程不是只有一条执行线</title><desc id="desc">fork 后父子并行，子进程 execve 不换 PID，exit 进入 ZOMBIE，waitpid 才释放任务槽</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">fork → execve → exit → waitpid</text><text x="30" y="79" class="detail">fork 创建新任务；execve 替换进程映像；退出与回收属于两个不同事件。</text>
<rect x="40" y="119" width="250" height="89" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="54" y="152">父任务 P</text><text class="detail" x="54" y="179">fork() 返回子 PID</text>
<path d="M290 163L320 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="321" y="119" width="266" height="89" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="335" y="152">子任务 C</text><text class="detail" x="335" y="179">fork() 返回 0</text>
<path d="M587 163L615 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="617" y="119" width="301" height="89" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="631" y="152">execve()</text><text class="detail" x="631" y="179">保持 PID，替换地址空间</text>
<path d="M769 208V264H476V287" stroke="#147f80" fill="none" stroke-width="3" marker-end="url(#teal)"/>
<rect x="330" y="291" width="292" height="84" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="344" y="324">do_exit()</text><text class="detail" x="344" y="351">释放多数资源；TASK_ZOMBIE</text>
<path d="M622 333L650 333" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><rect x="652" y="291" width="270" height="84" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="666" y="324">父 task 的 waitpid()</text><text class="detail" x="666" y="351">release() 才释放 task 槽</text>
<path d="M166 208V333H327" stroke="#7164aa" stroke-width="2.5" fill="none" stroke-dasharray="7 5"/>
<text x="35" y="422" class="detail">紫色虚线：父任务继续执行，未来可能 wait；它不是子进程 execve 的一部分。</text></svg>
