<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>需求调页与 swap 的区别</title><desc>0.11 从可执行文件按需装入页面，0.12 在内存压力下将页面写入交换设备并按需换入</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="460" rx="20"/>
<text class="head" x="38" y="44">两条不同的后备路径</text>
<rect class="teal" x="40" y="94" width="240" height="104" rx="14"/><text class="label" x="160" y="125" text-anchor="middle">v0.11 demand paging</text><text class="small" x="160" y="151" text-anchor="middle">缺页 → 从 executable 装入</text>
<rect class="gold" x="360" y="94" width="240" height="104" rx="14"/><text class="label" x="480" y="125" text-anchor="middle">v0.12 swap_out</text><text class="small" x="480" y="151" text-anchor="middle">内存紧张 → 扫描 PTE</text>
<rect class="rose" x="680" y="94" width="240" height="104" rx="14"/><text class="label" x="800" y="125" text-anchor="middle">swap device</text><text class="small" x="800" y="151" text-anchor="middle">dirty page 写入 slot</text>
<path class="line" d="M280 146H350"/><path class="line" d="M600 146H670"/>
<rect class="teal" x="360" y="270" width="240" height="104" rx="14"/><text class="label" x="480" y="301" text-anchor="middle">clean page</text><text class="small" x="480" y="327" text-anchor="middle">清 PTE / invalidate / free</text>
<rect class="violet" x="680" y="270" width="240" height="104" rx="14"/><text class="label" x="800" y="301" text-anchor="middle">swap_in</text><text class="small" x="800" y="327" text-anchor="middle">PTE 保存 slot 编号 → 读回</text>
<path class="line" d="M480 198V260"/><path class="line" d="M800 198V260"/>
<text class="small" x="480" y="420" text-anchor="middle">0.12 get_free_page() 申请失败时同步调用 swap_out()；这里没有独立 swapd 守护线程</text></svg>