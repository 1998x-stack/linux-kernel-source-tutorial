<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Linux 0.12 的按需换页路径</title><desc id="d">get_free_page 扫描 mem_map，失败调用 swap_out；干净页直接释放，脏且独占的页写入 swap slot；缺页时 swap_in 读回。</desc><defs><marker id="m26b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.box{fill:#fff;stroke:#147f80;stroke-width:2}.warn{fill:#fff5ed;stroke:#c46848;stroke-width:2}.vio{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.arr{fill:none;stroke:#147f80;stroke-width:2.6;marker-end:url(#m26b)}.ink{fill:#203035;font:700 17px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.label{fill:#a45b3e;font:700 13px system-ui,'Microsoft YaHei',sans-serif}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">内存分配失败触发换页；没有独立 swapd 线程</text><rect class="box" x="35" y="105" width="175" height="85" rx="12"/><text class="ink" x="58" y="137">get_free_page()</text><text class="small" x="58" y="164">扫描 mem_map</text><path class="arr" d="M210 148H290"/><rect class="warn" x="290" y="105" width="175" height="85" rx="12"/><text class="ink" x="321" y="137">无空闲页</text><text class="small" x="321" y="164">调用 swap_out()</text><path class="arr" d="M465 148H535"/><rect class="box" x="535" y="105" width="175" height="85" rx="12"/><text class="ink" x="563" y="137">扫描页表项</text><text class="small" x="563" y="164">try_to_swap_out()</text><path class="arr" d="M710 148H765"/><path class="arr" d="M622 190V250H255V288"/><rect class="vio" x="70" y="288" width="370" height="105" rx="12"/><text class="ink" x="94" y="322">脏页 + 引用计数为 1</text><text class="small" x="94" y="350">申请 swap slot → PTE 写入 swap 编码</text><text class="small" x="94" y="374">write_swap_page() → free_page()</text><rect class="box" x="515" y="288" width="370" height="105" rx="12"/><text class="ink" x="539" y="322">干净页</text><text class="small" x="539" y="350">清除 PTE → invalidate() → free_page()</text><text class="small" x="539" y="374">都可能释放出物理页供分配重试</text><path class="arr" d="M440 340H485"/><text class="label" x="445" y="325">另一分支</text><text class="small" x="40" y="435">缺页路径遇到非 present 的 swap 编码时，swap_in() 分配物理页并调用 read_swap_page()。</text></svg>