<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Linux 0.12 的按需换页路径</title><desc id="d">get_free_page 扫描 mem_map，失败调用 swap_out；try_to_swap_out 根据页是否干净、是否独占和是否有 swap slot 决定释放、换出或继续扫描；缺页时 swap_in 读回。</desc><defs><marker id="m26b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.box{fill:#fff;stroke:#147f80;stroke-width:2}.warn{fill:#fff5ed;stroke:#c46848;stroke-width:2}.vio{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.arr{fill:none;stroke:#147f80;stroke-width:2.6;marker-end:url(#m26b)}.ink{fill:#203035;font:700 17px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.label{fill:#a45b3e;font:700 13px system-ui,'Microsoft YaHei',sans-serif}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">内存分配失败触发扫描；不是后台 swapd 定期换页</text><rect class="box" x="35" y="105" width="175" height="85" rx="12"/><text class="ink" x="58" y="137">get_free_page()</text><text class="small" x="58" y="164">扫描 mem_map</text><path class="arr" d="M210 148H290"/><rect class="warn" x="290" y="105" width="175" height="85" rx="12"/><text class="ink" x="321" y="137">无空闲页</text><text class="small" x="321" y="164">调用 swap_out()</text><path class="arr" d="M465 148H535"/><rect class="box" x="535" y="105" width="175" height="85" rx="12"/><text class="ink" x="563" y="137">扫描页表项</text><text class="small" x="563" y="164">try_to_swap_out()</text><path class="arr" d="M710 148H770"/><rect class="warn" x="770" y="105" width="155" height="85" rx="12"/><text class="ink" x="795" y="137">检查页状态</text><text class="small" x="795" y="164">dirty / refcount</text><path class="arr" d="M847 190V235H255V288"/><path class="arr" d="M847 235H700V288"/><text class="label" x="190" y="263">脏且独占、有 swap slot</text><text class="label" x="690" y="263">干净页</text><rect class="vio" x="70" y="288" width="370" height="105" rx="12"/><text class="ink" x="94" y="322">脏页 + 引用计数为 1</text><text class="small" x="94" y="350">申请 swap slot → PTE 写入 swap 编码</text><text class="small" x="94" y="374">write_swap_page() → free_page()</text><rect class="box" x="515" y="288" width="370" height="105" rx="12"/><text class="ink" x="539" y="322">干净页</text><text class="small" x="539" y="350">清除 PTE → invalidate() → free_page()</text><text class="small" x="539" y="374">引用计数减少；物理页可能释放</text><text class="small" x="40" y="435">脏页若被共享或无法取得 swap slot，会继续扫描；缺页遇到 swap 编码时由 swap_in() 读回。</text></svg>