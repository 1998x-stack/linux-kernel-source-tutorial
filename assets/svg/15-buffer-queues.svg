<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">同一个 buffer_head 在哈希链和循环自由链中的双重链接</title><desc id="desc">b_next/b_prev 组成 hash bucket 链；b_next_free/b_prev_free 组成循环自由链；两个关系不是两份缓冲区</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">两套链表，不是两份缓存</text><text x="30" y="79" class="detail">hash(dev,block) 负责找；free_list 负责候选重用扫描。</text>
<rect x="35" y="118" width="246" height="91" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="49" y="151">hash_table[307]</text><text class="detail" x="49" y="178">(dev ^ block) % 307</text>
<path d="M281 162L331 162" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="333" y="118" width="265" height="91" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="347" y="151">b_next / b_prev</text><text class="detail" x="347" y="178">按设备+块号查询</text>
<path d="M598 162L645 162" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="647" y="118" width="278" height="91" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="661" y="151">buffer_head + 1KiB</text><text class="detail" x="661" y="178">b_data 指向数据块</text>
<path d="M781 209V263H483V287" stroke="#7164aa" stroke-width="3" fill="none" marker-end="url(#violet)"/>
<rect x="292" y="290" width="392" height="87" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="306" y="323">free_list 循环链</text><text class="detail" x="306" y="350">b_next_free / b_prev_free</text>
<text x="34" y="421" class="detail">b_count>0 的项不能回收；挑选规则看 BADNESS，而不是“严格 LRU 最久未用”。</text></svg>
