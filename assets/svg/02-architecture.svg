<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 架构和代码目录</title><desc id="desc">上层用户程序通过系统调用进入核心子系统，再由驱动接触硬件；图示为逻辑依赖</desc><rect width="960" height="460" rx="18" fill="#fffdfa"/><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.tiny{font-size:13px;fill:#53676d}.hd{font-size:21px;font-weight:750}.mono{font:700 16px ui-monospace,Consolas,monospace}.line{stroke:#7b9492;stroke-width:2;fill:none}.solid{stroke:#147f80;stroke-width:3;fill:none}.dash{stroke:#b17e43;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#b17e43"/></marker></defs>
<text x="35" y="44" class="hd">调用路径比目录树更重要</text>
<rect x="260" y="70" width="440" height="75" rx="12" fill="#f4f2fb" stroke="#6c64b2" stroke-width="2"/><text x="278" y="102" font-size="17" font-weight="700">用户进程</text><text x="278" y="127" class="small">lib/ 包装部分用户态系统调用</text>
<path d="M480 145 L480 185" class="solid" marker-end="url(#arr)"/><rect x="315" y="186" width="330" height="70" rx="12" fill="#f0f6f4" stroke="#147f80" stroke-width="2"/><text x="333" y="218" font-size="17" font-weight="700">系统调用入口</text><text x="333" y="243" class="small">kernel/system_call.s</text>
<path d="M480 256V282H169V304 M480 282V304 M480 282H794V304" class="solid" marker-end="url(#arr)"/>
<rect x="35" y="305" width="270" height="81" rx="12" fill="#f0f6f4" stroke="#147f80" stroke-width="2"/><text x="53" y="337" font-size="17" font-weight="700">kernel/ · 调度/信号</text><text x="53" y="362" class="small">sched.c · fork.c</text>
<rect x="345" y="305" width="270" height="81" rx="12" fill="#fff1eb" stroke="#c46848" stroke-width="2"/><text x="363" y="337" font-size="17" font-weight="700">fs/ · 文件与进程 I/O</text><text x="363" y="362" class="small">open.c · namei.c</text>
<rect x="654" y="305" width="270" height="81" rx="12" fill="#f5f2fd" stroke="#6c64b2" stroke-width="2"/><text x="672" y="337" font-size="17" font-weight="700">mm/ · 页管理</text><text x="672" y="362" class="small">memory.c</text>
<text x="35" y="425" class="small">设备层：kernel/blk_drv/、kernel/chr_drv/ 通过控制器与外设交互；include/ 定义共享接口。</text>
</svg>
