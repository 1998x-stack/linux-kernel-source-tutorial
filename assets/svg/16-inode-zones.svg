<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">一个 inode 的 9 个 i_zone 指针</title><desc id="svg-desc">i_zone[0..6] 直接；i_zone[7] 一级间接；i_zone[8] 二级间接。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:12px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">一个 inode 的 9 个 i_zone 指针</text><text x="30" y="71" class="subtitle">i_zone[0..6] 直接；i_zone[7] 一级间接；i_zone[8] 二级间接。</text>
<rect x="40" y="119" width="224" height="93" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="54" y="149" class="node">d_inode</text><text x="54" y="173" class="detail">i_zone[0] … i_zone[8]</text>
<path d="M264 162L305 139" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M264 170L305 240" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M264 179L305 344" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="309" y="100" width="291" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="323" y="130" class="node">直接：7 个数据区</text><text x="323" y="154" class="detail">逻辑块 0…6</text>
<rect x="309" y="205" width="291" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="323" y="235" class="node">一级间接：1 块指针表</text><text x="323" y="259" class="detail">512 × uint16 zone</text>
<rect x="309" y="310" width="291" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="323" y="340" class="node">二级间接：指针表树</text><text x="323" y="364" class="detail">512 × 512 zone</text>
<path d="M600 139L665 139" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M600 245L665 245" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M600 354L665 354" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="670" y="100" width="246" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="684" y="130" class="node">数据区块</text><text x="684" y="154" class="detail">最大 7 × 1KiB</text>
<rect x="670" y="205" width="246" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="684" y="235" class="node">数据区块</text><text x="684" y="259" class="detail">最多 512 × 1KiB</text>
<rect x="670" y="310" width="246" height="80" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="684" y="340" class="node">数据区块</text><text x="684" y="364" class="detail">最多 512² × 1KiB</text>
<text x="40" y="430" class="detail">_bmap() 精确索引：block &lt; 7；减 7 后 &lt; 512；再走两级表。边界来自 fs/inode.c。</text></svg>
