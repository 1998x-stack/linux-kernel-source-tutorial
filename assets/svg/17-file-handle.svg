<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">fd → struct file → inode → 数据块</title><desc id="svg-desc">描述符属于进程，file 对象带独立 f_pos，inode 表示文件；同一个 inode 可被多个 fd 共享。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:12px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">fd → struct file → inode → 数据块</text><text x="30" y="71" class="subtitle">描述符属于进程，file 对象带独立 f_pos，inode 表示文件；同一个 inode 可被多个 fd 共享。</text>
<rect x="37" y="116" width="213" height="95" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="51" y="146" class="node">task_struct</text><text x="51" y="170" class="detail">filp[fd]，至多 20</text>
<path d="M250 164L283 164" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="287" y="116" width="241" height="95" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="301" y="146" class="node">file_table[]</text><text x="301" y="170" class="detail">f_count、f_pos、f_flags</text>
<path d="M528 164L560 164" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="564" y="116" width="347" height="95" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="578" y="146" class="node">inode_table[]</text><text x="578" y="170" class="detail">i_count、i_zone、i_size</text>
<path d="M741 211V264H457V288" stroke="#147f80" fill="none" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="292" y="292" width="327" height="87" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="306" y="322" class="node">bmap() → bread()</text><text x="306" y="346" class="detail">逻辑块转设备区号，再访问缓存</text>
<text x="37" y="421" class="detail">fork/dup 可能共享 struct file，因此共享 f_pos；第二次 open 同一 inode 通常得到不同 file 对象。</text></svg>
