<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">printk 的真实数据路径</title><desc>printk 用 vsprintf 把格式化结果写入一个 1024 字节静态缓冲区，然后调用 _tty_write 以通道 0 送给控制台 tty，经 write_q 由 con_write 输出到 VGA 显存</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="amber" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b07a1f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="420" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">printk 只做两件事：格式化，然后写通道 0</text><text x="30" y="76" class="detail">0.11 的 printk 没有任何日志级别或环形缓冲，代码不到 40 行。</text>
<rect x="30" y="110" width="185" height="70" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="140">printk(fmt,...)</text><text class="detail" x="46" y="162">va_start 取可变参数</text>
<rect x="270" y="110" width="205" height="70" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="286" y="140">vsprintf(buf,fmt,args)</text><text class="detail" x="286" y="162">写入静态 char buf[1024]</text>
<rect x="530" y="110" width="205" height="70" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="546" y="140">_tty_write(0,buf,i)</text><text class="detail" x="546" y="162">通道 0 = 控制台</text>
<rect x="790" y="110" width="140" height="70" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="806" y="140">con_write</text><text class="detail" x="806" y="162">→ 0xb8000</text>
<path d="M215 145H266" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#teal)"/><path d="M475 145H526" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M735 145H786" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="30" y="225" width="420" height="150" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="253">为什么调用 tty_write 前要存 fs</text><text class="detail" x="48" y="277">内核态下 fs 可能指向用户段，直接在内核里做字符串操作会出错。</text><text class="detail" x="48" y="300">printk 用一段 __asm__ 先 push fs/ds，把 fs=ds 后调用 _tty_write。</text><text class="mini" x="48" y="326">返回后恢复 fs，并把返回值（字符数）交回调用者。</text><text class="mini" x="48" y="350">这段汇编里 pushl $0 就是通道号，_buf 是那 1024 字节缓冲区。</text>
<rect x="510" y="225" width="420" height="150" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="528" y="253">这些能力 0.11 都还没有</text><text class="detail" x="528" y="277">没有 KERN_* 日志级别，没有按级别过滤的控制台输出。</text><text class="detail" x="528" y="300">没有 dmesg 环形缓冲，读日志只能看屏幕（或串口终端）。</text><text class="mini" x="528" y="326">buf 是单个静态数组，中断上下文并发调用会互相覆盖。</text><text class="mini" x="528" y="350">日志级别、缓冲与 syslog 是后来的内核才逐步加入的。</text></svg>
