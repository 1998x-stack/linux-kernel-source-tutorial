<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">0.11 可用的三类取证手段</title><desc id="desc">源码内用 printk 打点；源码外用 Bochs 内建调试器或 QEMU 加 GDB 单步；对异常现象则在 trap.c 的异常处理里看寄存器与错误码</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="amber" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b07a1f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}</style><rect width="960" height="430" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">三类取证手段，各自能看到什么、看不到什么</text><text x="30" y="76" class="detail">0.11 没有内核内建调试器、没有 /proc/kallsyms、没有 kprobe；能用的都在这张图里。</text>
<rect x="30" y="105" width="290" height="285" rx="14" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="135">源码内：printk 打点</text><text class="detail" x="48" y="165">在 kmain、中断处理、调度路径里插入 printk。</text><text class="detail" x="48" y="190">能定位“哪条语句被走到”。</text><text class="mini" x="48" y="222">局限：会拖慢时序、可能掩盖竞态；</text><text class="mini" x="48" y="245">静态 buf[1024] 不可重入；</text><text class="mini" x="48" y="268">没有级别，无法按严重程度过滤。</text><text class="mini" x="48" y="310">用 grep 找调用点：</text><text class="mini" x="48" y="334">grep -rn 'printk(' kernel init mm fs</text>
<rect x="335" y="105" width="290" height="285" rx="14" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="353" y="135">源码外：调试器单步</text><text class="detail" x="353" y="165">Bochs 内建调试器或 QEMU + GDB 远程调试。</text><text class="detail" x="353" y="190">能在指令级停下，查看寄存器和内存。</text><text class="mini" x="353" y="222">局限：这些工具不属于 0.11 源码；</text><text class="mini" x="353" y="245">需符号或反汇编才能落到函数；</text><text class="mini" x="353" y="268">中断上下文里单步会改变观察对象。</text><text class="mini" x="353" y="310">观察点：引导入口 0x7C00、</text><text class="mini" x="353" y="334">中断向量表项、CR2 页故障地址。</text>
<rect x="640" y="105" width="290" height="285" rx="14" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="658" y="135">现象归类：从异常看原因</text><text class="detail" x="658" y="165">0.11 在 kernel/trap.c 里处理异常并打印寄存器。</text><text class="detail" x="658" y="190">先给现象归类，再回源码找分支。</text><text class="mini" x="658" y="222">页错误（#PF）：查 CR2 给出的线性地址；</text><text class="mini" x="658" y="245">一般保护（#GP）：段/特权级越界；</text><text class="mini" x="658" y="268">双重错误：内核栈本身已不可用。</text><text class="mini" x="658" y="310">注意：打印本身也可能是再次出错的原因，</text><text class="mini" x="658" y="334">需分清“原始故障”与“故障处理中的故障”。</text></svg>
