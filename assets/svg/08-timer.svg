<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">IRQ0 定时器中断的真实入口执行顺序</title><desc id="chart-desc">timer_interrupt 保存寄存器、设置段寄存器、jiffies 递增、向 PIC 发送 EOI、do_timer 后共享返回路径</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">IRQ0 的硬件时序与软件链路</text><text x="34" y="78" class="detail">在 0.11 中不能把 asm.s 的 CPU 异常模板当作 timer_interrupt。</text>
<rect x="33" y="117" width="174" height="81" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="47" y="148" class="node">PIT / IRQ0</text><text x="47" y="173" class="detail">PIC → IDT[0x20]</text>
<path d="M207 158L236 158" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="237" y="117" width="205" height="81" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="251" y="148" class="node">保存现场</text><text x="251" y="173" class="detail">push ds/es/fs/寄存器</text>
<path d="M442 158L471 158" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="473" y="117" width="200" height="81" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="487" y="148" class="node">记账与确认</text><text x="487" y="173" class="detail">jiffies++ / EOI</text>
<path d="M673 158L702 158" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="703" y="117" width="222" height="81" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="717" y="148" class="node">do_timer(cpl)</text><text x="717" y="173" class="detail">时间片 / 计时器</text>
<path d="M814 198V251H257V275" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="88" y="279" width="369" height="92" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="102" y="310" class="node">计时器决定是否调度</text><text x="102" y="335" class="detail">用户态时间片到期 → schedule</text>
<path d="M457 325L499 325" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="502" y="279" width="369" height="92" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="516" y="310" class="node">ret_from_sys_call</text><text x="516" y="335" class="detail">检查适用的信号 / iret</text>
<text x="34" y="424" class="detail">EOI 在本版中断入口处发送；不是从一个不存在的通用 do_IRQ() 回调返回。</text></svg>
