<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">UNIX GNU MINIX Linux 的历史关系</title><desc id="desc">时间轴上 GNU 和 MINIX 是背景及影响，不是 Linux 内核的父子代码关系</desc><rect width="960" height="440" rx="18" fill="#fffdfa"/><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.tiny{font-size:13px;fill:#53676d}.hd{font-size:21px;font-weight:750}.mono{font:700 16px ui-monospace,Consolas,monospace}.line{stroke:#7b9492;stroke-width:2;fill:none}.solid{stroke:#147f80;stroke-width:3;fill:none}.dash{stroke:#b17e43;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#b17e43"/></marker></defs>
<text x="38" y="47" class="hd">Linux 出现之前：三个互补的背景</text>
<line x1="98" y1="178" x2="852" y2="178" stroke="#97aeaa" stroke-width="5"/>
<circle cx="140" cy="178" r="11" fill="#6c64b2"/><circle cx="343" cy="178" r="11" fill="#c46848"/><circle cx="552" cy="178" r="11" fill="#a77925"/><circle cx="760" cy="178" r="11" fill="#147f80"/>
<rect x="55" y="61" width="180" height="92" rx="12" fill="#f3f0fa" stroke="#6c64b2" stroke-width="2"/><text x="73" y="93" font-size="17" font-weight="700">UNIX</text><text x="73" y="118" class="small">1969 起的系统谱系</text>
<rect x="254" y="224" width="186" height="92" rx="12" fill="#fff1eb" stroke="#c46848" stroke-width="2"/><text x="272" y="256" font-size="17" font-weight="700">GNU</text><text x="272" y="281" class="small">1983 宣布计划</text>
<rect x="461" y="61" width="187" height="92" rx="12" fill="#f9f4e6" stroke="#a77925" stroke-width="2"/><text x="479" y="93" font-size="17" font-weight="700">MINIX</text><text x="479" y="118" class="small">1987 教学系统</text>
<rect x="681" y="224" width="200" height="92" rx="12" fill="#eef8f4" stroke="#147f80" stroke-width="2"/><text x="699" y="256" font-size="17" font-weight="700">Linux</text><text x="699" y="281" class="small">1991 内核诞生</text>
<path d="M140 153V166 M343 190V224 M552 153V166 M760 190V224" stroke="#97aeaa" stroke-width="2" fill="none"/>
<text x="62" y="367" class="small">GNU 提供自由软件生态；MINIX 为研究与讨论提供环境；Linux 是独立实现的新内核。</text>
<text x="62" y="395" class="small">1991 的 Linux 0.11 与 1994 的 Linux 1.0 是两个不同阶段。</text></svg>
