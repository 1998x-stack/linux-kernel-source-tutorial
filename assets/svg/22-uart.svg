<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Linux 0.11 串口：UART 中断识别与队列搬运</title><desc id="svg-desc">serial.c 配置 UART，rs_io.s 处理 IIR 中断原因；C 与汇编共享 tty_queue 的固定字段偏移。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b75e3f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.sub{font-size:14px;fill:#647879}.node{font-size:16px;font-weight:720}.detail{font-size:13px;fill:#566c70}.tiny{font-size:11.5px;fill:#6a7d7f}.line{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#arr)}.warnline{fill:none;stroke:#b75e3f;stroke-width:2.5;marker-end:url(#warn)}.teal{fill:#eef8f5;stroke:#147f80;stroke-width:1.6}.sand{fill:#fff4ed;stroke:#b75e3f;stroke-width:1.6}.slate{fill:#f2f5f6;stroke:#789094;stroke-width:1.4}</style><rect width="960" height="470" rx="16" fill="#fffdfa"/><text x="30" y="43" class="title">Linux 0.11 串口：UART 中断识别与队列搬运</text><text x="30" y="69" class="sub">serial.c 配置 UART，rs_io.s 处理 IIR 中断原因；C 与汇编共享 tty_queue 的固定字段偏移。</text>
<rect x="35" y="110" width="198" height="84" rx="12" class="teal"/><text x="49" y="137" class="node">COM1 / tty 1</text><text x="49" y="159" class="detail">base 0x3F8 · IRQ4 · vector 0x24</text>
<rect x="35" y="219" width="198" height="84" rx="12" class="teal"/><text x="49" y="246" class="node">COM2 / tty 2</text><text x="49" y="268" class="detail">base 0x2F8 · IRQ3 · vector 0x23</text>
<path d="M233 151L277 151" class="line"/>
<path d="M233 260L277 260" class="line"/>
<rect x="281" y="110" width="208" height="84" rx="12" class="teal"/><text x="295" y="137" class="node">serial.c · init()</text><text x="295" y="159" class="detail">DLAB=1；divisor=48；2400 bps</text>
<rect x="281" y="219" width="208" height="84" rx="12" class="teal"/><text x="295" y="246" class="node">线路 / 调制解调器</text><text x="295" y="268" class="detail">LCR=0x03 (8N1)；MCR=0x0B</text>
<path d="M489 151L535 151" class="line"/>
<path d="M489 260L535 260" class="line"/>
<rect x="539" y="110" width="190" height="84" rx="12" class="teal"/><text x="553" y="137" class="node">IER = 0x0D</text><text x="553" y="159" class="detail">RX / line status / modem</text>
<rect x="539" y="219" width="190" height="84" rx="12" class="teal"/><text x="553" y="246" class="node">rs_write()</text><text x="553" y="268" class="detail">有待发送字节时使能 THRE</text>
<path d="M729 151L773 151" class="line"/>
<path d="M729 260L773 260" class="line"/>
<rect x="777" y="110" width="149" height="84" rx="12" class="teal"/><text x="791" y="137" class="node">rs_io.s</text><text x="791" y="159" class="detail">读 IIR，循环分派</text>
<rect x="777" y="219" width="149" height="84" rx="12" class="teal"/><text x="791" y="246" class="node">read_char / write_char</text><text x="791" y="268" class="detail">read_q / write_q</text>
<text x="37" y="362" class="detail">寄存器偏移：0 数据；1 IER；2 IIR；3 LCR；4 MCR；5 LSR；6 MSR。DLAB=1 时 0/1 改为 divisor low/high。</text>
<text x="37" y="400" class="tiny">0.11 不启用 FCR/FIFO；这里是 8250/16450 兼容寄存器模型，不可把 16550A FIFO 当成已使用。</text>
<text x="37" y="432" class="detail">rs_init：COM1 向量 0x24，COM2 向量 0x23；rs_io.s 由汇编入口读 IIR 并逐个处理 pending cause。</text></svg>
