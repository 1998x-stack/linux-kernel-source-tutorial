<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">RAM Disk 的块与扇区单位换算</title><desc id="d">一个 1KiB 文件系统 block 对应两个 512 字节 request sector，偏移和长度通过左移 9 位转换为字节。</desc><style>.bg{fill:#fbfdfc}.block{fill:#e8f4f1;stroke:#147f80;stroke-width:2}.sector{fill:#fff4eb;stroke:#c46848;stroke-width:2}.ink{fill:#203035;font:700 19px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:15px system-ui,'Microsoft YaHei',sans-serif}.mono{fill:#147f80;font:700 16px ui-monospace,monospace}.line{stroke:#a8bcb8;stroke-width:2}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="45">不要混用 block number、sector number 和 byte offset</text><rect class="block" x="85" y="110" width="790" height="80" rx="12"/><text class="ink" x="360" y="145">1 filesystem block</text><text class="small" x="410" y="171">BLOCK_SIZE = 1024 bytes</text><path class="line" d="M480 190V235M280 235H680M280 235V270M680 235V270"/><rect class="sector" x="100" y="270" width="360" height="80" rx="10"/><rect class="sector" x="500" y="270" width="360" height="80" rx="10"/><text class="ink" x="215" y="305">sector 0</text><text class="small" x="210" y="330">512 bytes</text><text class="ink" x="615" y="305">sector 1</text><text class="small" x="610" y="330">512 bytes</text><text class="mono" x="100" y="395">byte_offset = sector &lt;&lt; 9</text><text class="mono" x="520" y="395">byte_length = nr_sectors &lt;&lt; 9</text><text class="small" x="100" y="440">一个 1KiB buffer block 进入 ll_rw_block 时，sector = block_number × 2，nr_sectors = 2。</text></svg>