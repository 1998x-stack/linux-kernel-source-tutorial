<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">eBPF 验证器与 XDP 数据路径</title><desc id="d">程序加载时先经过 eBPF verifier；数据包在网卡接收后进入 native driver 或 generic SKB XDP 路径，再按程序动作 PASS、DROP、TX 或 REDIRECT。</desc><defs><marker id="m27b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.box{fill:#fff;stroke:#147f80;stroke-width:2}.vio{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.warn{fill:#fff4eb;stroke:#c46848;stroke-width:2}.arr{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#m27b)}.ink{fill:#203035;font:700 17px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.tiny{fill:#53676d;font:12px system-ui,'Microsoft YaHei',sans-serif}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">加载安全检查与数据包执行路径是两件事</text><rect class="vio" x="35" y="95" width="245" height="100" rx="12"/><text class="ink" x="60" y="130">eBPF program</text><text class="small" x="60" y="158">程序类型 / attach point</text><text class="small" x="60" y="180">helper 能力受类型约束</text><path class="arr" d="M280 145H340"/><rect class="box" x="340" y="95" width="270" height="100" rx="12"/><text class="ink" x="370" y="130">Verifier</text><text class="small" x="370" y="158">寄存器 / 指针范围 / 栈初始化</text><text class="small" x="370" y="180">边界与有界循环证明</text><path class="arr" d="M610 145H675"/><rect class="warn" x="675" y="95" width="250" height="100" rx="12"/><text class="ink" x="705" y="130">load accepted?</text><text class="small" x="705" y="158">拒绝不安全程序</text><text class="small" x="705" y="180">通过后才可 attach</text><rect class="box" x="35" y="270" width="175" height="78" rx="10"/><text class="ink" x="66" y="303">NIC RX</text><text class="small" x="66" y="327">接收帧</text><path class="arr" d="M210 309H275"/><rect class="vio" x="275" y="250" width="275" height="118" rx="12"/><text class="ink" x="300" y="283">XDP execution</text><text class="small" x="300" y="311">Native：驱动较早路径</text><text class="small" x="300" y="336">Generic：SKB 通用路径</text><text class="tiny" x="300" y="357">HW offload 需设备支持</text><path class="arr" d="M550 309H615"/><rect class="box" x="615" y="238" width="310" height="145" rx="12"/><text class="ink" x="640" y="270">XDP action</text><g fill="#e4f2ef" stroke="#147f80"><rect x="640" y="288" width="120" height="31" rx="5"/><rect x="775" y="288" width="120" height="31" rx="5"/><rect x="640" y="330" width="120" height="31" rx="5"/><rect x="775" y="330" width="120" height="31" rx="5"/></g><text class="small" x="674" y="309">PASS</text><text class="small" x="810" y="309">DROP</text><text class="small" x="674" y="351">TX</text><text class="small" x="805" y="351">REDIRECT</text><text class="small" x="35" y="430">从 Linux 5.3 起支持可证明终止的 bounded loops；不是放开任意循环。</text></svg>