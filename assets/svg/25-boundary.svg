<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc"><title id="title">_syscall0 存根与内核函数的约定</title><desc>用户侧 _syscall0 展开的函数把调用号放进 eax 后执行 int 0x80；内核 _system_call 换段后调用 sys_hello，返回值经 eax 返回；用户侧若结果为负则设置 errno 并返回 -1</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="380" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">同一份返回值约定，被存根包成两种结果</text><text x="30" y="76" class="detail">_syscall0 的展开来自 include/unistd.h，是所有系统调用存根的共同模板。</text>
<rect x="30" y="110" width="300" height="120" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="48" y="138">用户侧 hello()</text><text class="detail" x="48" y="162">long __res;</text><text class="detail" x="48" y="185">asm: int $0x80（eax=__NR_hello）</text><text class="mini" x="48" y="211">由 _syscall0(int,hello) 生成</text>
<rect x="365" y="110" width="230" height="120" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="383" y="138">特权级边界</text><text class="detail" x="383" y="162">CS 0x0f → 0x10</text><text class="detail" x="383" y="185">参数在 ebx/ecx/edx</text><text class="mini" x="383" y="211">由 _system_call 保存并换段</text>
<rect x="630" y="110" width="300" height="120" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="648" y="138">内核侧 sys_hello()</text><text class="detail" x="648" y="162">执行完毕后把结果放回 eax</text><text class="detail" x="648" y="185">负数即错误码（非 errno 风格）</text><text class="mini" x="648" y="211">用户侧再翻译成 -1 + errno</text>
<path d="M330 170H361" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M595 170H626" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#teal)"/>
<rect x="30" y="262" width="420" height="90" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="290">成功路径</text><text class="detail" x="48" y="314">__res &gt;= 0 时直接 return (type)__res</text><text class="mini" x="48" y="338">sys_hello 返回 0 就得到 0</text>
<rect x="510" y="262" width="420" height="90" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="528" y="290">失败路径</text><text class="detail" x="528" y="314">__res &lt; 0 时 errno = -__res; return -1</text><text class="mini" x="528" y="338">因此内核函数应返回负值，而不是自己设 errno</text></svg>
