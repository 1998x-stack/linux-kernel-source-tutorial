<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">内存分配：0.11 与现代内核对照</title><desc>0.11 用 mem_map 字节计数和 get_free_page 反向扫描单页；现代内核在页框层面用伙伴系统，在对象层面用 SLUB 等 slab 分配器做缓存</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}</style><rect width="960" height="430" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">同样是“给内核一块内存”，抽象层级不同</text><text x="30" y="76" class="detail">左侧是 0.11 源码中可核对的事实；右侧是广泛使用的现代设计，仅供对照。</text>
<rect x="30" y="105" width="430" height="60" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="143">Linux 0.11（本章基线）</text>
<rect x="30" y="180" width="430" height="220" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="detail" x="48" y="208">页级：get_free_page() 反向扫描 mem_map</text><text class="mini" x="48" y="234">mem_map 是一个按物理页计数的字节数组</text><text class="mini" x="48" y="258">USED=100 表示被占用；free_page 递减到 0</text><text class="mini" x="48" y="282">没有“阶”的概念，一次只给 4KiB 页</text><text class="detail" x="48" y="316">对象级：没有通用小对象分配器</text><text class="mini" x="48" y="342">内核结构体多固定占用整页或静态数组</text><text class="mini" x="48" y="366">（如 task_struct 与内核栈共享一页）</text>
<rect x="500" y="105" width="430" height="60" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="520" y="143">现代内核（对照，非 0.11）</text>
<rect x="500" y="180" width="430" height="220" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="detail" x="520" y="208">页级：伙伴系统（Buddy）</text><text class="mini" x="520" y="234">按 2 的幂“阶”管理页框，支持分配/合并</text><text class="mini" x="520" y="258">缓解碎片，可一次给出连续多页</text><text class="detail" x="520" y="292">对象级：slab 家族（SLAB / SLUB / SLOB）</text><text class="mini" x="520" y="318">为常用结构体建立对象缓存，减少重复初始化</text><text class="mini" x="520" y="342">与伙伴系统配合：slab 从页框取内存再切分</text>
<text x="30" y="424" class="mini">共同点：都是“内核内部的内存管理”。区别在抽象粒度与数据结构的复杂度，不能把两者当同一套机制。</text></svg>
