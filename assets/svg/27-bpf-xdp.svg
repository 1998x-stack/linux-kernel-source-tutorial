<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>XDP 与 AF_XDP 接收路径</title><desc>XDP 程序在接收路径早期分流，PASS 进入 skb 网络栈，DROP/TX/REDIRECT 可改变处理路径</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="38" y="42">Receive path · 先验证，再执行</text>
<rect class="panel" x="45" y="100" width="180" height="82" rx="14"/><text class="label" x="135" y="131" text-anchor="middle">NIC RX</text><text class="small" x="135" y="157" text-anchor="middle">descriptor / buffer</text>
<rect class="teal" x="275" y="100" width="210" height="82" rx="14"/><text class="label" x="380" y="131" text-anchor="middle">XDP program</text><text class="small" x="380" y="157" text-anchor="middle">verifier-approved BPF</text>
<path class="line" d="M225 141H265"/>
<rect class="panel" x="585" y="55" width="300" height="74" rx="14"/><text class="label" x="735" y="86" text-anchor="middle">XDP_PASS</text><text class="small" x="735" y="112" text-anchor="middle">转换/构造 skb → 网络栈</text>
<rect class="rose" x="585" y="155" width="140" height="74" rx="14"/><text class="label" x="655" y="186" text-anchor="middle">XDP_DROP</text><text class="small" x="655" y="212" text-anchor="middle">丢弃</text>
<rect class="gold" x="745" y="155" width="140" height="74" rx="14"/><text class="label" x="815" y="186" text-anchor="middle">XDP_TX</text><text class="small" x="815" y="212" text-anchor="middle">回送</text>
<rect class="violet" x="275" y="285" width="210" height="82" rx="14"/><text class="label" x="380" y="316" text-anchor="middle">XDP_REDIRECT</text><text class="small" x="380" y="342" text-anchor="middle">devmap / XSKMAP</text>
<rect class="teal" x="585" y="285" width="300" height="82" rx="14"/><text class="label" x="735" y="316" text-anchor="middle">AF_XDP socket</text><text class="small" x="735" y="342" text-anchor="middle">UMEM + FILL / RX / TX / COMPLETION</text>
<path class="line" d="M485 125H535V92H575"/><path class="line" d="M485 141H575V192"/><path class="line" d="M485 141H735V192"/><path class="line" d="M380 182V275"/><path class="line" d="M485 326H575"/>
<text class="small" x="480" y="430" text-anchor="middle">AF_XDP copy/zero-copy 取决于 bind flag 与驱动能力；native XDP 也不代表整个网络栈被替换</text></svg>