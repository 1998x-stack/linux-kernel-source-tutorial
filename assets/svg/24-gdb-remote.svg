<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">QEMU 与 GDB 的远程调试回路</title><desc>运行 0.11 的 QEMU 通过 gdb stub 暴露一个 TCP 端口；宿主机 GDB 载入符号、设断点，命中后 CPU 暂停，GDB 读寄存器和内存，再继续或单步</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="430" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">调试器不在 0.11 里，而是从外部“遥控”CPU</text><text x="30" y="76" class="detail">QEMU 的 gdb stub 让宿主机 GDB 像调试本地程序一样停住虚拟机。</text>
<rect x="30" y="110" width="300" height="150" rx="14" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="140">QEMU（客户机）</text><text class="detail" x="48" y="168">运行 v0.11 内核与磁盘映像</text><text class="detail" x="48" y="192">-s：开放 gdb stub（tcp::1234）</text><text class="detail" x="48" y="216">-S：启动即暂停，等 GDB 接入</text><text class="mini" x="48" y="242">不修改内核，就能在任何指令处停住</text>
<rect x="630" y="110" width="300" height="150" rx="14" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="648" y="140">GDB（宿主机）</text><text class="detail" x="648" y="168">读入带符号的 vmlinux</text><text class="detail" x="648" y="192">target remote :1234</text><text class="detail" x="648" y="216">break / si / x 读内存与寄存器</text><text class="mini" x="648" y="242">符号来自编译产物，不是内核自带</text>
<path d="M330 165H626" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M626 205H334" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><text x="404" y="152" class="mini">断点/继续/单步命令</text><text x="404" y="228" class="mini">寄存器与内存应答</text>
<rect x="30" y="290" width="285" height="110" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="48" y="318">命中后发生什么</text><text class="detail" x="48" y="342">CPU 暂停 → GDB 读 EIP/寄存器</text><text class="detail" x="48" y="366">→ x 查看栈与结构体 → 继续</text><text class="mini" x="48" y="390">观察本身会改变时序，竞态可能被掩盖</text>
<rect x="338" y="290" width="285" height="110" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="356" y="318">地址口径的陷阱</text><text class="detail" x="356" y="342">head.s 开启分页前：地址就是物理地址</text><text class="detail" x="356" y="366">开启分页后：须经页表映射</text><text class="mini" x="356" y="390">同一符号在两种阶段含义不同，别照搬</text>
<rect x="646" y="290" width="284" height="110" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="664" y="318">没有符号怎么办</text><text class="detail" x="664" y="342">汇编阶段（bootsect/setup/head）</text><text class="detail" x="664" y="366">只能按已知入口地址下断或反汇编</text><text class="mini" x="664" y="390">0.11 没有内核内建的符号查询接口</text></svg>
