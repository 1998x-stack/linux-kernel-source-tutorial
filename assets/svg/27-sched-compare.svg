<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">调度策略：0.11 与现代内核对照</title><desc id="desc">0.11 的 schedule 在每个时间片递减 counter、选择 counter 最大者，全部耗尽时统一重算；现代内核用 CFS 的虚拟运行时间或 EEVDF 的虚拟截止时间挑选下一个任务</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}</style><rect width="960" height="410" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">“选下一个该跑的任务”这一句话，实现差了一整个设计史</text><text x="30" y="76" class="detail">两边都以“公平”为目标，但 0.11 靠整数计数，现代内核靠可调权重的虚拟时间。</text>
<rect x="30" y="105" width="430" height="270" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="133">Linux 0.11：可核对</text><text class="detail" x="48" y="161">每个任务有一个 counter</text><text class="mini" x="48" y="187">时钟 tick 把当前任务的 counter 减一</text><text class="mini" x="48" y="211">schedule 扫描 task[]，选 counter 最大者</text><text class="mini" x="48" y="235">若全为 0，则按 priority 统一重算 counter</text><text class="mini" x="48" y="259">counter 同时充当时间片与优先级</text><text class="detail" x="48" y="291">特点：O(n) 扫描、整数、无“权重”概念</text><text class="mini" x="48" y="317">切换靠 TSS + 汇编 ljmp，而非现代上下文结构</text><text class="mini" x="48" y="341">（详见第 10 章 kernel/sched.c 与 switch_to）</text>
<rect x="500" y="105" width="430" height="270" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="520" y="133">现代内核（对照，非 0.11）</text><text class="detail" x="520" y="161">CFS：按虚拟运行时间 vruntime 选最小者</text><text class="mini" x="520" y="187">每任务维护 vruntime，红黑树取最左节点</text><text class="mini" x="520" y="211">权重随 nice 变化，而非固定时间片</text><text class="detail" x="520" y="243">EEVDF：改用虚拟截止时间挑选</text><text class="mini" x="520" y="269">在“公平”之外更明确地表达延迟诉求</text><text class="detail" x="520" y="301">特点：非线性结构、按权重伸缩时间</text><text class="mini" x="520" y="327">（CFS 约于 2.6.23，EEVDF 约于 6.6；请以目标内核文档为准）</text>
<text x="30" y="400" class="mini">本章不做性能断言：0.11 与现代内核调度器的优劣需要具体负载与测量，图示只描述挑选规则。</text></svg>
