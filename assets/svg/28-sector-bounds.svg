<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>RAM Disk sector 边界检查</title><desc>512KiB RAM Disk 有 1024 个 512B sectors，最后一个 1KiB block 覆盖 sectors 1022–1023</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="38" y="44">容量先换算为扇区数，再计算地址</text>
<rect class="panel" x="60" y="95" width="840" height="96" rx="14"/>
<rect x="75" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="98" y="148" text-anchor="middle">0</text><rect x="125" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="148" y="148" text-anchor="middle">64</text><rect x="175" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="198" y="148" text-anchor="middle">128</text><rect x="225" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="248" y="148" text-anchor="middle">192</text><rect x="275" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="298" y="148" text-anchor="middle">256</text><rect x="325" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="348" y="148" text-anchor="middle">320</text><rect x="375" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="398" y="148" text-anchor="middle">384</text><rect x="425" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="448" y="148" text-anchor="middle">448</text><rect x="475" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="498" y="148" text-anchor="middle">512</text><rect x="525" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="548" y="148" text-anchor="middle">576</text><rect x="575" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="598" y="148" text-anchor="middle">640</text><rect x="625" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="648" y="148" text-anchor="middle">704</text><rect x="675" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="698" y="148" text-anchor="middle">768</text><rect x="725" y="118" width="46" height="48" rx="5" fill="#fff1d5" stroke="#c9d3ce"/><text class="tiny" x="748" y="148" text-anchor="middle">832</text><rect x="775" y="118" width="46" height="48" rx="5" fill="#e1f2ee" stroke="#c9d3ce"/><text class="tiny" x="798" y="148" text-anchor="middle">1022</text><rect x="825" y="118" width="46" height="48" rx="5" fill="#e1f2ee" stroke="#c9d3ce"/><text class="tiny" x="848" y="148" text-anchor="middle">1023</text>
<text class="small" x="480" y="218" text-anchor="middle">图示抽样显示最后两个合法 sector：1022、1023</text>
<rect class="teal" x="75" y="260" width="240" height="88" rx="14"/><text class="label" x="195" y="291" text-anchor="middle">valid request</text><text class="small" x="195" y="317" text-anchor="middle">sector=1022, count=2</text>
<rect class="rose" x="360" y="260" width="240" height="88" rx="14"/><text class="label" x="480" y="291" text-anchor="middle">crossing end</text><text class="small" x="480" y="317" text-anchor="middle">sector=1023, count=2</text>
<rect class="rose" x="645" y="260" width="240" height="88" rx="14"/><text class="label" x="765" y="291" text-anchor="middle">outside</text><text class="small" x="765" y="317" text-anchor="middle">sector=1024, count=1</text>
<text class="small" x="195" y="382" text-anchor="middle">1022 ≤ 1024</text>
<text class="small" x="480" y="382" text-anchor="middle">2 &gt; 1024 − 1023</text>
<text class="small" x="765" y="382" text-anchor="middle">1 &gt; 1024 − 1024</text>
<text class="tag" x="480" y="445" text-anchor="middle">count &gt; 0 ∧ sector ≤ capacity ∧ count ≤ capacity − sector</text></svg>