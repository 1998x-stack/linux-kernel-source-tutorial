<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Linux 0.11 到 1.0 的版本演进</title><desc id="d">版本时间线显示 0.12 的按需装入与换页、0.96c 的文件系统注册和 alpha extfs、0.98 的可选 TCP/IP、0.99.x 的每任务 CR3、1.0 的稳定发布。</desc><defs><marker id="m26a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.axis{stroke:#147f80;stroke-width:4;marker-end:url(#m26a)}.node{fill:#fff;stroke:#147f80;stroke-width:3}.warm{fill:#fff7ef;stroke:#c46848;stroke-width:2}.violet{fill:#f5f2ff;stroke:#7461ba;stroke-width:2}.ink{fill:#203035;font:700 19px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:15px system-ui,'Microsoft YaHei',sans-serif}.tiny{fill:#53676d;font:13px system-ui,'Microsoft YaHei',sans-serif}.date{fill:#147f80;font:700 14px ui-monospace,monospace}</style><rect class="bg" width="960" height="480" rx="18"/><text x="40" y="45" class="ink">功能不是“版本号清单”：代码、默认构建、成熟度要分开</text><path class="axis" d="M70 230H900"/><g><circle class="node" cx="110" cy="230" r="13"/><rect class="node" x="45" y="93" width="150" height="104" rx="12"/><text class="date" x="65" y="120">1991 / 0.11</text><text class="ink" x="65" y="150">起始基线</text><text class="small" x="65" y="176">全局页目录</text><text class="small" x="65" y="193">MINIX 文件系统</text></g><g><circle class="node" cx="275" cy="230" r="13"/><rect class="warm" x="205" y="268" width="145" height="116" rx="12"/><text class="date" x="224" y="295">0.12</text><text class="ink" x="224" y="326">按需装入</text><text class="small" x="224" y="350">共享页与磁盘换页</text><text class="small" x="224" y="372">不是 swapd</text></g><g><circle class="node" cx="440" cy="230" r="13"/><rect class="node" x="365" y="92" width="155" height="112" rx="12"/><text class="date" x="384" y="120">0.95a → 0.96c</text><text class="ink" x="384" y="150">文件系统抽象</text><text class="small" x="384" y="175">函数表 → 类型注册</text><text class="small" x="384" y="194">extfs 仍是 alpha</text></g><g><circle class="node" cx="610" cy="230" r="13"/><rect class="violet" x="535" y="268" width="155" height="116" rx="12"/><text class="date" x="555" y="295">0.98-pl1</text><text class="ink" x="555" y="326">网络源码</text><text class="small" x="555" y="350">TCP/IP 在源码树</text><text class="small" x="555" y="372">默认不编译</text></g><g><circle class="node" cx="775" cy="230" r="13"/><rect class="warm" x="705" y="92" width="160" height="112" rx="12"/><text class="date" x="725" y="120">0.99-pl11</text><text class="ink" x="725" y="150">独立 CR3</text><text class="small" x="725" y="175">任务页目录</text><text class="small" x="725" y="194">3GiB / 1GiB 布局</text></g><g><circle class="node" cx="900" cy="230" r="13"/><text class="date" x="842" y="267">1994-03-14</text><text class="ink" x="842" y="290">1.0</text><text class="small" x="842" y="314">稳定发布</text></g><text class="tiny" x="42" y="438">阅读顺序：先确认 tag → 打开源文件 → 查看发布公告 → 判断默认配置与成熟度。</text></svg>