<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">4096 字节物理页，4095 字节最大有效容量</title><desc id="svg-desc">head/tail 以 &amp; 4095 环绕；留空一个字节区分 empty 与 full。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:13px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">4096 字节物理页，4095 字节最大有效容量</text><text x="30" y="71" class="subtitle">head/tail 以 &amp; 4095 环绕；留空一个字节区分 empty 与 full。</text>
<rect x="31" y="115" width="203" height="94" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="45" y="145" class="node">PIPE_HEAD</text><text x="45" y="169" class="detail">写入位置；递增</text>
<path d="M234 158L277 158" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="281" y="115" width="398" height="94" rx="12" fill="#fff4ee" stroke="#ba6543" stroke-width="1.6"/><text x="295" y="145" class="node">4096-byte 环形页</text><text x="295" y="169" class="detail">PIPE_SIZE = (head − tail) &amp; 4095</text>
<path d="M679 158L724 158" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="729" y="115" width="197" height="94" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="743" y="145" class="node">PIPE_TAIL</text><text x="743" y="169" class="detail">读取位置；递增</text>
<rect x="36" y="281" width="277" height="85" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="50" y="311" class="node">空：head == tail</text><text x="50" y="335" class="detail">read 等待或检查读写端</text>
<rect x="342" y="281" width="277" height="85" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="356" y="311" class="node">满：size == 4095</text><text x="356" y="335" class="detail">write 等待或触发 SIGPIPE</text>
<rect x="648" y="281" width="274" height="85" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="662" y="311" class="node">数据拷贝</text><text x="662" y="335" class="detail">get_fs_byte / put_fs_byte</text>
<text x="38" y="415" class="detail">索引演算：head=4094，tail=4092，写入 3 字节后 head=(4094+3)&amp;4095=1。</text></svg>
