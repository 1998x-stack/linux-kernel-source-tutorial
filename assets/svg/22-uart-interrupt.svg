<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">rs_io.s 的中断分派</title><desc id="desc">串口中断在 rs_int 里反复读中断识别寄存器，用 jmp_table 按低三位分派到 modem_status、write_char、read_char 或 line_status；read_char 把接收字节放入 read_q，write_char 从 write_q 发送</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="amber" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b07a1f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="450" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">一个中断入口，靠中断识别寄存器选择动作</text><text x="30" y="76" class="detail">_rs1_interrupt / _rs2_interrupt 只是把对应的 table_list 指针压栈后跳进 rs_int。</text>
<rect x="30" y="106" width="200" height="64" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="46" y="134">IRQ4 / IRQ3</text><text class="detail" x="46" y="156">串口 1 / 串口 2</text>
<rect x="285" y="106" width="250" height="64" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="302" y="130">rs_int: inb %dx（基址+2）</text><text class="detail" x="302" y="151">IIR，bit0=0 表示有中断</text>
<rect x="600" y="106" width="330" height="64" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="616" y="130">jmp_table(,%eax,2)</text><text class="detail" x="616" y="151">IA32 每项 4 字节，但 bit0 已为 0 故乘 2</text>
<path d="M230 138H281" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M535 138H596" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="30" y="215" width="215" height="62" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="241">modem_status</text><text class="detail" x="46" y="262">读状态寄存器即清除</text>
<rect x="265" y="215" width="215" height="62" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="281" y="241">read_char</text><text class="detail" x="281" y="262">inb → read_q，调 do_tty_interrupt</text>
<rect x="500" y="215" width="215" height="62" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="516" y="241">write_char</text><text class="detail" x="516" y="262">write_q 取字节 outb 到端口</text>
<rect x="735" y="215" width="195" height="62" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="751" y="241">line_status</text><text class="detail" x="751" y="262">读 LSR 清除</text>
<path d="M420 170H137V211" fill="none" stroke="#7164aa" stroke-width="2.2" marker-end="url(#teal)"/><path d="M440 170H372V211" fill="none" stroke="#147f80" stroke-width="2.2" marker-end="url(#teal)"/><path d="M470 170H607V211" fill="none" stroke="#bc6949" stroke-width="2.2" marker-end="url(#warm)"/><path d="M495 170H832V211" fill="none" stroke="#7164aa" stroke-width="2.2" marker-end="url(#teal)"/>
<rect x="30" y="320" width="430" height="100" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="348">write_char 的两个退路</text><text class="detail" x="48" y="370">队列剩 &lt;= startup(256) 字节时唤醒写进程</text><text class="detail" x="48" y="391">队列空时改写 IER，关闭发送中断</text><text class="mini" x="48" y="411">transmit interrupt 只有在还有数据时才需要开着</text>
<rect x="500" y="320" width="430" height="100" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="518" y="348">循环直到无待处理中断</text><text class="detail" x="518" y="370">rep_int 反复读 IIR，直到 bit0=1</text><text class="detail" x="518" y="391">最后统一 outb $0x20,$0x20 送回 EOI</text><text class="mini" x="518" y="411">与键盘中断在同一次 outb 里送出 8259 结束命令</text></svg>
