<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">a.out 文件按需装入和共享干净页面</title><desc id="desc">do_no_page 区分可执行映像与匿名空页；文件页面先尝试与相同 executable 的进程共享，失败则读取最多四个 1KiB 块</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">第一次读可执行代码：不等于 execve 一次读入</text><text x="30" y="79" class="detail">execve 先保留 executable inode；缺页时才用 bread_page 加载 4 个 1KiB 块。</text>
<rect x="34" y="121" width="249" height="91" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="154">do_no_page</text><text class="detail" x="48" y="181">address - start_code</text>
<path d="M283 165L308 165" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="310" y="121" width="270" height="91" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="324" y="154">是否属于 executable</text><text class="detail" x="324" y="181">否则 get_empty_page</text>
<path d="M580 165L605 165" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="607" y="121" width="321" height="91" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="621" y="154">share_page 成功？</text><text class="detail" x="621" y="181">相同 inode 的干净页可共享</text>
<path d="M765 212V257H466V284" stroke="#bc6949" stroke-width="2.6" fill="none" marker-end="url(#warm)"/>
<rect x="317" y="287" width="437" height="88" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="331" y="320">未共享：get_free_page → bread_page</text><text class="detail" x="331" y="347">bmap 4 个 1KiB 块，尾部零填充</text>
<text x="34" y="422" class="detail">此机制属于 v0.11 的 a.out 按需装入，不能称为现代 ELF 页缓存 / mmap 实现。</text></svg>
