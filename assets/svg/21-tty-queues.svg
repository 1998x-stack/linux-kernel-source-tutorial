<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">tty 的三个队列</title><desc id="desc">键盘或串口收到的原始字符进入 read_q；行规程 copy_to_cooked 处理后放入 secondary 供用户 read 取走；用户 write 的字符进入 write_q，再由 con_write 或 rs_write 送往硬件</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:16px;font-weight:730}.detail{font-size:14px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 14px ui-monospace,Consolas,monospace}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">三个队列把硬件字符流变成"可读的一行"</text><text x="30" y="76" class="detail">每个 tty_queue = char buf[1024] + head/tail + proc_list；三个队列方向各不相同。</text>
<rect x="30" y="120" width="150" height="70" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="52" y="152">键盘 / UART</text><text class="detail" x="52" y="176">硬件中断</text>
<rect x="255" y="112" width="180" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="270" y="145">read_q</text><text class="detail" x="270" y="169">原始字符</text><text class="mini" x="270" y="189">GETCH(queue,c)</text>
<rect x="505" y="112" width="180" height="86" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="520" y="140">copy_to_cooked</text><text class="detail" x="520" y="164">退格 / 删行 / 信号</text><text class="mini" x="520" y="186">行规程 line discipline</text>
<rect x="755" y="112" width="175" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="770" y="145">secondary</text><text class="detail" x="770" y="169">加工后的一行</text><text class="mini" x="770" y="189">secondary.data</text>
<path d="M180 155H251" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M435 155H501" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M685 155H751" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<text x="755" y="226" class="mini">读路径：read(0,buf,n) → GETCH secondary</text>
<rect x="755" y="250" width="175" height="80" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="770" y="282">用户进程 read()</text><text class="detail" x="770" y="306">阻塞直到有一行</text><text class="mini" x="770" y="324">put_fs_byte 到用户区</text>
<path d="M842 198V246" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="30" y="352" width="150" height="70" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="52" y="384">用户进程 write()</text><text class="detail" x="52" y="408">put_fs_byte 取字符</text>
<rect x="255" y="344" width="180" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="270" y="377">write_q</text><text class="detail" x="270" y="401">待输出字符</text><text class="mini" x="270" y="421">PUTCH(c,write_q)</text>
<rect x="505" y="344" width="180" height="86" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="520" y="377">tty-&gt;write(tty)</text><text class="detail" x="520" y="401">con_write / rs_write</text><text class="mini" x="520" y="421">函数指针分派</text>
<rect x="755" y="344" width="175" height="86" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="770" y="377">VGA / UART</text><text class="detail" x="770" y="401">0xb8000 / 0x3f8</text>
<path d="M180 387H251" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M435 387H501" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M685 387H751" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/>
<text x="30" y="455" class="mini">write_q.data 对控制台为 0、对串口保存端口基址（如 0x3f8），供底层驱动回写中断使能寄存器。</text></svg>
