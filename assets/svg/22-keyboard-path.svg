<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">keyboard.S 的扫描码路径</title><desc>按键产生 IRQ1；_keyboard_interrupt 从端口 0x60 读扫描码，用 key_table 分派到 do_self、修饰键、光标键或功能键；结果经 put_queue 写入控制台 read_q 并唤醒等待进程</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">从端口 0x60 到 read_q：三条命令改一个状态字</text><text x="30" y="76" class="detail">键盘中断向量是 0x21（IDT 里的 IRQ1），处理全程用汇编，避免 C 调用开销。</text>
<rect x="30" y="108" width="150" height="66" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="48" y="138">按键事件</text><text class="detail" x="48" y="160">8042 产生 IRQ1</text>
<rect x="235" y="108" width="215" height="66" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="252" y="132">inb $0x60 → %al</text><text class="detail" x="252" y="153">先识别 E0/E1 前缀</text>
<rect x="505" y="108" width="200" height="66" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="522" y="132">key_table(,%eax,4)</text><text class="detail" x="522" y="153">按扫描码分派</text>
<rect x="760" y="108" width="170" height="66" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="778" y="138">EOI</text><text class="detail" x="778" y="160">outb $0x20,$0x20</text>
<path d="M180 141H231" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M450 141H501" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M705 141H756" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/>
<rect x="30" y="215" width="205" height="72" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="46" y="243">do_self</text><text class="detail" x="46" y="265">普通键：alt/shift/key_map 选表</text>
<rect x="258" y="215" width="205" height="72" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="274" y="243">ctrl / alt / shift</text><text class="detail" x="274" y="265">orb/andb 改 mode 字节</text>
<rect x="486" y="215" width="205" height="72" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="502" y="243">caps / scroll / num</text><text class="detail" x="502" y="265">xorb leds，发 0xed 命令</text>
<rect x="714" y="215" width="216" height="72" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="730" y="243">cursor / func</text><text class="detail" x="730" y="265">方向键→ESC[?，F1→ESC[[A</text>
<path d="M605 174V211" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/>
<rect x="300" y="330" width="360" height="80" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="318" y="360">put_queue：写入控制台 read_q</text><text class="detail" x="318" y="382">movl _table_list,%edx；最多压入 8 字节</text><text class="mini" x="318" y="401">head/tail 用 andl $size-1 回绕；非空则唤醒 proc_list</text>
<path d="M132 287V352H296" fill="none" stroke="#bc6949" stroke-width="2.5" marker-end="url(#warm)"/><path d="M360 287V326" fill="none" stroke="#7164aa" stroke-width="2.5" marker-end="url(#violet)"/><path d="M588 287V326" fill="none" stroke="#7164aa" stroke-width="2.5" marker-end="url(#violet)"/><path d="M822 287V352H664" fill="none" stroke="#bc6949" stroke-width="2.5" marker-end="url(#warm)"/>
<text x="30" y="447" class="mini">写入 read_q 后，do_tty_interrupt 紧接着调用 copy_to_cooked，把原始字符加工进 secondary。</text></svg>
