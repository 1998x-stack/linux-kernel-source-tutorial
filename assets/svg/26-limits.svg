<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 的四个硬边界</title><desc>0.11 有按需分页但没有换出到磁盘；文件系统只实现了 MINIX 一种，没有 VFS 抽象；没有网络协议栈；内核地址空间与每进程用户线性空间都有固定上限</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}</style><rect width="960" height="430" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">先把 0.11 画到墙上，才知道后来在补什么</text><text x="30" y="76" class="detail">以下四条都能在 0.11 源码里直接核对，不涉及后续版本。</text>
<rect x="30" y="106" width="430" height="130" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="134">有按需分页，但没有换出</text><text class="detail" x="48" y="158">缺页时从文件读或分配零页，页不会被写到磁盘。</text><text class="mini" x="48" y="184">mm/memory.c 的 do_no_page / do_wp_page 只做“装入/复制”，</text><text class="mini" x="48" y="206">没有换出页与交换设备的代码路径。</text>
<rect x="500" y="106" width="430" height="130" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="520" y="134">只有 MINIX 一种文件系统</text><text class="detail" x="520" y="158">superblock、inode、目录项都是 MINIX 磁盘格式。</text><text class="mini" x="520" y="184">没有“文件系统类型”的抽象层，</text><text class="mini" x="520" y="206">挂载与路径解析直接面向 MINIX。</text>
<rect x="30" y="258" width="430" height="130" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="48" y="286">没有网络协议栈</text><text class="detail" x="48" y="310">字符设备里只有 tty、串口、键盘等。</text><text class="mini" x="48" y="336">串口能收发字节，但没有套接字、</text><text class="mini" x="48" y="358">没有 TCP/IP，也没有 socket 系统调用。</text>
<rect x="500" y="258" width="430" height="130" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="520" y="286">地址空间有固定上限</text><text class="detail" x="520" y="310">内核初始只恒等映射前 16MiB（head.s）。</text><text class="mini" x="520" y="336">每个任务的用户段基址为 nr×0x4000000，</text><text class="mini" x="520" y="358">即每进程 64MiB 线性空间。</text></svg>
