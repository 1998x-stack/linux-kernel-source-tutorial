<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 初始分页结构</title><desc id="desc">页目录位于物理 0x0000，四张页表位于 0x1000 至 0x4000，各映射 4MiB，合计 16MiB 恒等映射</desc><rect width="960" height="450" rx="18" fill="#fffdfa"/><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.small{font-size:15px;fill:#53676d}.tiny{font-size:13px;fill:#53676d}.hd{font-size:21px;font-weight:750}.mono{font:700 16px ui-monospace,Consolas,monospace}.line{stroke:#7b9492;stroke-width:2;fill:none}.solid{stroke:#147f80;stroke-width:3;fill:none}.dash{stroke:#b17e43;stroke-width:2;stroke-dasharray:8 6;fill:none}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#147f80"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#b17e43"/></marker></defs>
<text x="33" y="45" class="hd">4 张页表 × 1024 项 × 4 KiB = 16 MiB</text>
<rect x="34" y="80" width="220" height="78" rx="12" fill="#f0f6f4" stroke="#147f80" stroke-width="2"/><text x="52" y="112" font-size="17" font-weight="700">CR3 = 0</text><text x="52" y="137" class="small">页目录 @ 0x0000</text>
<path d="M254 120 L310 120" class="solid" marker-end="url(#arr)"/>
<rect x="310" y="70" width="613" height="195" rx="12" fill="#f2f7f6" stroke="#c9dbd6"/>
<rect x="324" y="90" width="134" height="150" rx="9" fill="#e8f5f1" stroke="#147f80"/><text x="338" y="126" class="mono">PDE 0</text><text x="338" y="160" class="small">pg0</text><text x="338" y="185" class="small">@ 0x1000</text><text x="338" y="211" class="tiny">4 MiB 映射</text><rect x="472" y="90" width="134" height="150" rx="9" fill="#f3f0fa" stroke="#6c64b2"/><text x="486" y="126" class="mono">PDE 1</text><text x="486" y="160" class="small">pg1</text><text x="486" y="185" class="small">@ 0x2000</text><text x="486" y="211" class="tiny">4 MiB 映射</text><rect x="620" y="90" width="134" height="150" rx="9" fill="#e8f5f1" stroke="#147f80"/><text x="634" y="126" class="mono">PDE 2</text><text x="634" y="160" class="small">pg2</text><text x="634" y="185" class="small">@ 0x3000</text><text x="634" y="211" class="tiny">4 MiB 映射</text><rect x="768" y="90" width="134" height="150" rx="9" fill="#f3f0fa" stroke="#6c64b2"/><text x="782" y="126" class="mono">PDE 3</text><text x="782" y="160" class="small">pg3</text><text x="782" y="185" class="small">@ 0x4000</text><text x="782" y="211" class="tiny">4 MiB 映射</text>
<rect x="34" y="301" width="889" height="67" rx="10" fill="#f7f0e7" stroke="#b17e43"/>
<path d="M34 301V368" stroke="#b17e43" stroke-width="1"/><path d="M256 301V368" stroke="#b17e43" stroke-width="1"/><path d="M478 301V368" stroke="#b17e43" stroke-width="1"/><path d="M700 301V368" stroke="#b17e43" stroke-width="1"/>
<text x="49" y="330" class="small">0–4 MiB</text><text x="271" y="330" class="small">4–8 MiB</text><text x="491" y="330" class="small">8–12 MiB</text><text x="713" y="330" class="small">12–16 MiB</text>
<text x="36" y="415" class="small">恒等映射：初始阶段线性地址等于物理地址；不是所有后续进程都永久使用此映射。</text></svg>
