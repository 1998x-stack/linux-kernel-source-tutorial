<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">异常、时钟中断和系统调用在 IDT 分流</title><desc id="chart-desc">0 号异常、0x20 时钟 IRQ 与 0x80 系统调用经过不同 gate 和入口文件</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">同一张 IDT，不同入口与权限语义</text><text x="34" y="78" class="detail">head.s 先填默认 256 项；之后 traps/sched 分别安装处理器。</text>
<rect x="35" y="110" width="267" height="84" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="49" y="141" class="node">异常：#DE 向量 0</text><text x="49" y="166" class="detail">traps.c → asm.s</text>
<rect x="347" y="110" width="267" height="84" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="361" y="141" class="node">时钟 IRQ0：0x20</text><text x="361" y="166" class="detail">sched_init() intr gate</text>
<rect x="659" y="110" width="267" height="84" rx="11" fill="#fff1eb" stroke="#bf6c48" stroke-width="1.7"/><text x="673" y="141" class="node">系统调用：0x80</text><text x="673" y="166" class="detail">sched_init() system gate</text>
<path d="M167 194L167 246" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><path d="M480 194L480 246" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><path d="M792 194L792 246" stroke="#bf6c48" stroke-width="2.5" fill="none" marker-end="url(#warm)"/>
<rect x="35" y="251" width="267" height="88" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="49" y="282" class="node">内核异常入口</text><text x="49" y="307" class="detail">asm.s：错误码分支</text>
<rect x="347" y="251" width="267" height="88" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="361" y="282" class="node">timer_interrupt</text><text x="361" y="307" class="detail">system_call.s → do_timer</text>
<rect x="659" y="251" width="267" height="88" rx="11" fill="#fff1eb" stroke="#bf6c48" stroke-width="1.7"/><text x="673" y="282" class="node">system_call</text><text x="673" y="307" class="detail">system_call.s → sys_call_table</text>
<rect x="35" y="369" width="890" height="58" rx="10" class="band"/>
<text x="54" y="393" class="detail">Gate type：trap/intr 决定 IF 行为；DPL 决定 int 指令是否允许来自用户态。</text>
<text x="54" y="415" class="mini">0x80 为 DPL=3 的 trap gate；0x20 为 DPL=0 的 interrupt gate。</text></svg>
