<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">MINIX v1：磁盘块与超级块位置</title><desc id="svg-desc">一个磁盘块 1024 字节；磁盘布局按 0、1、i 位图、z 位图、inode 表、数据区推进。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:13px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">MINIX v1：磁盘块与超级块位置</text><text x="30" y="71" class="subtitle">一个磁盘块 1024 字节；磁盘布局按 0、1、i 位图、z 位图、inode 表、数据区推进。</text>
<rect x="34" y="115" width="126" height="90" rx="12" fill="#fff4ee" stroke="#ba6543" stroke-width="1.6"/><text x="48" y="145" class="node">块 0</text><text x="48" y="169" class="detail">保留/引导</text>
<path d="M160 160L181 160" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="184" y="115" width="129" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="198" y="145" class="node">块 1</text><text x="198" y="169" class="detail">超级块</text>
<path d="M313 160L334 160" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="338" y="115" width="169" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="352" y="145" class="node">inode 位图</text><text x="352" y="169" class="detail">imap_blocks</text>
<path d="M507 160L528 160" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="532" y="115" width="169" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="546" y="145" class="node">zone 位图</text><text x="546" y="169" class="detail">zmap_blocks</text>
<path d="M701 160L722 160" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="726" y="115" width="196" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="740" y="145" class="node">inode 表</text><text x="740" y="169" class="detail">32 字节 / inode</text>
<path d="M834 205V261H160V284" stroke="#147f80" fill="none" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="37" y="291" width="291" height="85" rx="12" fill="#fff4ee" stroke="#ba6543" stroke-width="1.6"/><text x="51" y="321" class="node">数据区</text><text x="51" y="345" class="detail">firstdatazone → nzones</text>
<rect x="357" y="291" width="275" height="85" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="371" y="321" class="node">磁盘 super</text><text x="371" y="345" class="detail">SUPER_MAGIC = 0x137F</text>
<rect x="660" y="291" width="260" height="85" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="674" y="321" class="node">内存 super</text><text x="674" y="345" class="detail">s_imap[] / s_zmap[]</text>
<text x="38" y="418" class="detail">read_super(dev) 通过 bread(dev,1) 取超级块，随后读取两类位图；结构图并非按空间比例绘制。</text></svg>
