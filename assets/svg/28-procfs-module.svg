<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>现代 procfs 模块生命周期</title><desc>现代模块 init 创建 proc entry，cat 触发 seq_file read，exit 删除 proc entry</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="40" y="44">Modern Linux only · proc_ops + seq_file</text>
<rect class="teal" x="50" y="100" width="205" height="90" rx="14"/><text class="label" x="152.5" y="131" text-anchor="middle">insmod .ko</text><text class="small" x="152.5" y="157" text-anchor="middle">module_init()</text>
<rect class="gold" x="375" y="100" width="205" height="90" rx="14"/><text class="label" x="477.5" y="131" text-anchor="middle">proc_create()</text><text class="small" x="477.5" y="157" text-anchor="middle">/proc/kernel_lab</text>
<rect class="panel" x="700" y="100" width="205" height="90" rx="14"/><text class="label" x="802.5" y="131" text-anchor="middle">cat /proc/...</text><text class="small" x="802.5" y="157" text-anchor="middle">single_open → seq_read</text>
<path class="line" d="M255 145H365"/><path class="line" d="M580 145H690"/>
<rect class="violet" x="375" y="275" width="205" height="90" rx="14"/><text class="label" x="477.5" y="306" text-anchor="middle">module_exit()</text><text class="small" x="477.5" y="332" text-anchor="middle">proc_remove(entry)</text>
<path class="line" d="M802 190V235H480V265"/>
<text class="small" x="480" y="425" text-anchor="middle">proc_ops 属于现代 procfs API；不能把这份模块源代码回移植到 Linux 0.11</text></svg>