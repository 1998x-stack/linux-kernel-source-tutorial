<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>counter、CFS、EEVDF 调度选择</title><desc>三种调度模型：counter 最大扫描、最小 vruntime、eligible 后最早 virtual deadline</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="460" rx="20"/>
<text class="head" x="40" y="42">谁先获得 CPU？三种答案</text>
<rect class="gold" x="45" y="92" width="260" height="95" rx="14"/><text class="label" x="175" y="123" text-anchor="middle">0.11 counter</text><text class="small" x="175" y="149" text-anchor="middle">runnable 中 counter 最大</text>
<rect class="teal" x="350" y="92" width="260" height="95" rx="14"/><text class="label" x="480" y="123" text-anchor="middle">CFS</text><text class="small" x="480" y="149" text-anchor="middle">最小 vruntime（红黑树最左）</text>
<rect class="violet" x="655" y="92" width="260" height="95" rx="14"/><text class="label" x="785" y="123" text-anchor="middle">EEVDF</text><text class="small" x="785" y="149" text-anchor="middle">eligible → 最早 virtual deadline</text>
<path class="line" d="M175 187V235"/><path class="line" d="M480 187V235"/><path class="line" d="M785 187V235"/>
<rect class="panel" x="45" y="245" width="260" height="120" rx="14"/><text class="label" x="175" y="276" text-anchor="middle">重算时间片</text><text class="small" x="175" y="302" text-anchor="middle">counter = (counter &gt;&gt; 1) + priority</text>
<rect class="panel" x="350" y="245" width="260" height="120" rx="14"/><text class="label" x="480" y="276" text-anchor="middle">权重归一化记账</text><text class="small" x="480" y="302" text-anchor="middle">vruntime 随执行时间增加</text>
<rect class="panel" x="655" y="245" width="260" height="120" rx="14"/><text class="label" x="785" y="276" text-anchor="middle">先算 lag，再选 deadline</text><text class="small" x="785" y="302" text-anchor="middle">正 lag 才 eligible</text>
<text class="small" x="480" y="424" text-anchor="middle">EEVDF 自 Linux 6.6 开始逐步接替 CFS 的选择逻辑，不是一次性删掉所有 CFS 代码</text></svg>