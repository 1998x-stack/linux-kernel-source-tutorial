<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">fork 的写时复制映射</title><desc id="desc">父子拥有不同页表项但指向同一物理页；PTE 清可写位；写入引发缺页后再分配副本</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">先共享物理页，发生写入时才复制</text><text x="30" y="79" class="detail">只示意可写用户页的 fork/COW；0.11 首次 fork 对低 1 MiB 有特殊处理。</text>
<rect x="34" y="117" width="261" height="95" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="150">父进程 PTE</text><text class="detail" x="48" y="177">Present=1，RW=0</text>
<rect x="665" y="117" width="261" height="95" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="679" y="150">子进程 PTE</text><text class="detail" x="679" y="177">Present=1，RW=0</text>
<path d="M295 164L390 249" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M665 164L566 249" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/>
<rect x="389" y="238" width="179" height="85" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="403" y="271">同一物理页</text><text class="detail" x="403" y="298">mem_map = 2</text>
<path d="M480 323V354H166V366" fill="none" stroke="#bc6949" stroke-width="2.5" marker-end="url(#warm)"/>
<path d="M480 354H785V366" fill="none" stroke="#bc6949" stroke-width="2.5" marker-end="url(#warm)"/>
<text x="43" y="397" class="em">父写入 → 分配新页并复制</text><text x="557" y="397" class="em">子保持旧页；引用计数减一</text>
<text x="34" y="441" class="mini">若旧页引用计数为 1，un_wp_page 可以仅恢复写权限，不必复制。</text></svg>
