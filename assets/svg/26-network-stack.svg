<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>早期 Linux 网络栈层次</title><desc>v0.98 socket API 与 TCP/IP 模块，v0.99 NFS 客户端依赖网络文件访问</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="38" y="46">从用户接口到链路层，再回到文件系统客户端</text>
<rect class="panel" x="55" y="90" width="250" height="78" rx="14"/><text class="label" x="180" y="121" text-anchor="middle">应用 / socket()</text><text class="small" x="180" y="147" text-anchor="middle">AF_INET · AF_UNIX</text>
<rect class="teal" x="355" y="90" width="250" height="78" rx="14"/><text class="label" x="480" y="121" text-anchor="middle">socket layer</text><text class="small" x="480" y="147" text-anchor="middle">net/socket.c</text>
<rect class="gold" x="655" y="90" width="250" height="78" rx="14"/><text class="label" x="780" y="121" text-anchor="middle">协议层</text><text class="small" x="780" y="147" text-anchor="middle">TCP · UDP · ICMP · IP · ARP</text>
<path class="line" d="M305 129H345"/><path class="line" d="M605 129H645"/>
<rect class="panel" x="655" y="260" width="250" height="78" rx="14"/><text class="label" x="780" y="291" text-anchor="middle">链路与设备</text><text class="small" x="780" y="317" text-anchor="middle">Ethernet · packet · net device</text>
<rect class="violet" x="355" y="260" width="250" height="78" rx="14"/><text class="label" x="480" y="291" text-anchor="middle">NFS client</text><text class="small" x="480" y="317" text-anchor="middle">v0.99 file system client</text>
<path class="line" d="M780 168V250"/><path class="line" d="M655 299H615"/>
<text class="small" x="480" y="400" text-anchor="middle">0.98：TCP/IP 代码已在源码树，但版本公告仍说明未进入标准 boot image</text>
<text class="small" x="480" y="426" text-anchor="middle">0.99：网络代码更稳定，NFS client 进入标准发行内容</text></svg>