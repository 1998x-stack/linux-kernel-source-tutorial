<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">一次系统调用的可下断点位置</title><desc id="desc">用户程序执行 int 0x80 进入 _system_call，越界检查后用 _sys_call_table 分派到 sys_ 函数，返回时 _ret_from_sys_call 检查信号并可能调用 _do_signal，最后 iret 回到用户态</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}.bp{font-size:13px;font-weight:720;fill:#bc6949}</style><rect width="960" height="450" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">跟一次系统调用：入口、分派、返回、信号</text><text x="30" y="76" class="detail">序号即建议的断点顺序；沿着它单步，能看到寄存器与栈帧如何被保存和恢复。</text>
<rect x="30" y="110" width="165" height="76" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="140">int 0x80</text><text class="detail" x="46" y="164">eax=调用号，ebx/ecx/edx=参数</text>
<rect x="230" y="110" width="200" height="76" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="246" y="140">_system_call</text><text class="detail" x="246" y="164">越界检查，保存 ds/es/fs</text>
<rect x="465" y="110" width="215" height="76" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="481" y="140">_sys_call_table(,%eax,4)</text><text class="detail" x="481" y="164">按调用号取函数地址</text>
<rect x="715" y="110" width="215" height="76" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="731" y="140">sys_xxx</text><text class="detail" x="731" y="164">如 sys_write、sys_waitpid</text>
<path d="M195 148H226" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M430 148H461" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M680 148H711" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="465" y="235" width="465" height="82" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="481" y="263">_ret_from_sys_call</text><text class="detail" x="481" y="286">检查当前任务的 state/counter 决定是否 reschedule</text><text class="detail" x="481" y="306">只有当 CS=0x0f 且 OLDSS=0x17 时才处理信号</text>
<rect x="230" y="235" width="200" height="82" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="246" y="263">_do_signal</text><text class="detail" x="246" y="286">有待处理信号时才进入</text><text class="detail" x="246" y="306">改写返回帧以转去处理函数</text>
<rect x="30" y="235" width="165" height="82" rx="12" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="46" y="263">iret</text><text class="detail" x="46" y="286">恢复用户态 CS/EIP</text><text class="detail" x="46" y="306">回到 int 0x80 的下一条</text>
<path d="M700 186V231" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M465 276H434" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M230 276H199" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/>
<text x="30" y="360" class="bp">断点 1：_system_call 入口</text><text x="30" y="382" class="mini">看 eax 是否为合法调用号；越界会跳 bad_sys_call 并返回 -ENOSYS 类错误。</text>
<text x="30" y="410" class="bp">断点 2：sys_xxx 内部与 _ret_from_sys_call</text><text x="30" y="432" class="mini">前者看子系统逻辑，后者看信号与重新调度条件；0.11 的这套入口在 kernel/system_call.s。</text></svg>
