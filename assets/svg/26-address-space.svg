<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">从全局页目录到每任务 CR3</title><desc id="d">对比 0.12 的全局 pg_dir 与 0.99-pl11 的 task TSS CR3、独立页目录和共享高端内核映射。</desc><style>.bg{fill:#fbfdfc}.panel{fill:#fff;stroke:#d5e3e0;stroke-width:2}.old{fill:#fff6ee;stroke:#c46848;stroke-width:2}.new{fill:#f3f1ff;stroke:#7461ba;stroke-width:2}.kernel{fill:#dcefed;stroke:#147f80;stroke-width:1.5}.user{fill:#fff2df;stroke:#b27a2b;stroke-width:1.5}.ink{fill:#203035;font:700 18px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.num{fill:#147f80;font:700 14px ui-monospace,monospace}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">4GiB 是 32 位线性地址上限；不是可用用户 RAM 的承诺</text><rect class="panel" x="35" y="75" width="420" height="345" rx="14"/><text class="num" x="58" y="108">v0.12</text><text class="ink" x="58" y="139">全局页目录 pg_dir</text><rect class="old" x="70" y="175" width="350" height="65" rx="10"/><text class="ink" x="180" y="202">同一个 _pg_dir = 0</text><text class="small" x="115" y="225">按任务线性地址区间定位目录项</text><path d="M245 240V280M140 280H350M140 280V305M350 280V305" stroke="#c46848" stroke-width="2" fill="none"/><rect class="user" x="75" y="305" width="150" height="68" rx="8"/><rect class="user" x="265" y="305" width="150" height="68" rx="8"/><text class="ink" x="117" y="334">task A</text><text class="small" x="96" y="356">不同线性区间</text><text class="ink" x="307" y="334">task B</text><text class="small" x="286" y="356">不同线性区间</text><rect class="panel" x="500" y="75" width="425" height="345" rx="14"/><text class="num" x="523" y="108">v0.99-pl11</text><text class="ink" x="523" y="139">每个 task 保存 tss.cr3</text><rect class="new" x="535" y="170" width="170" height="55" rx="9"/><rect class="new" x="735" y="170" width="170" height="55" rx="9"/><text class="ink" x="588" y="202">CR3 A</text><text class="ink" x="788" y="202">CR3 B</text><path d="M620 225V252M820 225V252" stroke="#7461ba" stroke-width="2"/><rect class="user" x="535" y="252" width="170" height="90" rx="8"/><rect class="user" x="735" y="252" width="170" height="90" rx="8"/><text class="small" x="555" y="278">PDE 0–767</text><text class="ink" x="571" y="306">用户映射</text><text class="small" x="755" y="278">PDE 0–767</text><text class="ink" x="771" y="306">用户映射</text><rect class="kernel" x="535" y="355" width="370" height="43" rx="8"/><text class="ink" x="625" y="383">PDE 768–1023：共享内核区</text><text class="small" x="35" y="454">1024 个 PDE × 4MiB = 4GiB；具体 3GiB/1GiB 划分以 v0.99-pl11 代码为证，不泛化到所有架构。</text></svg>