<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img"><title>32 位地址空间误读纠正</title><desc>v0.12 的 64MiB per task 与 64 task slot 共 4GiB；v0.99/1.0 TASK_SIZE 3GiB</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="460" rx="20"/>
<text class="head" x="38" y="42">两个版本中的 TASK_SIZE 含义完全不同</text>
<text class="tag" x="80" y="92">v0.12 · 64 个任务槽位</text>
<rect x="80" y="118" width="90" height="54" rx="7" fill="#fff1d5" stroke="#8eaaa2"/><text class="tiny" x="125" y="150" text-anchor="middle">64MiB</text><rect x="180" y="118" width="90" height="54" rx="7" fill="#e1f2ee" stroke="#8eaaa2"/><text class="tiny" x="225" y="150" text-anchor="middle">64MiB</text><rect x="280" y="118" width="90" height="54" rx="7" fill="#fff1d5" stroke="#8eaaa2"/><text class="tiny" x="325" y="150" text-anchor="middle">64MiB</text><rect x="380" y="118" width="90" height="54" rx="7" fill="#e1f2ee" stroke="#8eaaa2"/><text class="tiny" x="425" y="150" text-anchor="middle">64MiB</text><rect x="480" y="118" width="90" height="54" rx="7" fill="#fff1d5" stroke="#8eaaa2"/><text class="tiny" x="525" y="150" text-anchor="middle">64MiB</text><rect x="580" y="118" width="90" height="54" rx="7" fill="#e1f2ee" stroke="#8eaaa2"/><text class="tiny" x="625" y="150" text-anchor="middle">64MiB</text><rect x="680" y="118" width="90" height="54" rx="7" fill="#fff1d5" stroke="#8eaaa2"/><text class="tiny" x="725" y="150" text-anchor="middle">64MiB</text><rect x="780" y="118" width="90" height="54" rx="7" fill="#e1f2ee" stroke="#8eaaa2"/><text class="tiny" x="825" y="150" text-anchor="middle">64MiB</text>
<text class="small" x="480" y="198" text-anchor="middle">图中只画 8 个槽位；源码 NR_TASKS=64 → 合计 4GiB</text>
<text class="tag" x="80" y="258">v0.99 / v1.0 · 单进程用户空间</text>
<rect x="80" y="282" width="600" height="78" rx="10" fill="#e1f2ee" stroke="#3c8e7f" stroke-width="2"/><text class="label" x="380" y="326" text-anchor="middle">USER · TASK_SIZE = 0xC0000000 · 3GiB</text>
<rect x="680" y="282" width="200" height="78" rx="10" fill="#eee9fb" stroke="#8172b5" stroke-width="2"/><text class="label" x="780" y="326" text-anchor="middle">KERNEL · 1GiB</text>
<text class="small" x="480" y="412" text-anchor="middle">32 位线性地址总宽度 4GiB ≠ 每个进程拥有 4GiB 用户空间 ≠ 物理 RAM 容量</text></svg>