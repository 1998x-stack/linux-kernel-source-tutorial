<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">硬盘驱动：分区扇区号 → CHS</title><desc id="svg-desc">0.11 从分区起始扇区偏移到整盘地址，再按 sectors-per-track 与 heads 转换。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:13px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">硬盘驱动：分区扇区号 → CHS</text><text x="30" y="71" class="subtitle">0.11 从分区起始扇区偏移到整盘地址，再按 sectors-per-track 与 heads 转换。</text>
<rect x="35" y="118" width="223" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="49" y="148" class="node">CURRENT-&gt;sector</text><text x="49" y="172" class="detail">块层 512B 扇区下标</text>
<path d="M258 162L291 162" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="295" y="118" width="258" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="309" y="148" class="node">加分区 start_sect</text><text x="309" y="172" class="detail">hd[minor].start_sect</text>
<path d="M553 162L586 162" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="590" y="118" width="336" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="604" y="148" class="node">整盘绝对扇区 S</text><text x="604" y="172" class="detail">再按几何参数 SPT、heads 拆解</text>
<rect x="38" y="296" width="278" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="52" y="326" class="node">sector</text><text x="52" y="350" class="detail">S % SPT + 1</text>
<rect x="342" y="296" width="278" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="356" y="326" class="node">head</text><text x="356" y="350" class="detail">(S / SPT) % heads</text>
<rect x="645" y="296" width="279" height="92" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="659" y="326" class="node">cylinder</text><text x="659" y="350" class="detail">S / (SPT × heads)</text>
<text x="37" y="432" class="detail">示例 S=1000，SPT=17，heads=4 → sector=15、head=2、cylinder=14（仅算术演示）。</text></svg>
