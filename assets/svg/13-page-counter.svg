<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">物理页分配和释放的引用计数规则</title><desc id="desc">USED=100 标记不可分配；0 表示空闲；get_free_page 找到 0 置 1 并清零物理页；free_page 扣引用计数</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">一个字节的 mem_map，表示什么？</text><text x="30" y="79" class="detail">它不是单比特位图；0 → 1 是分配，2 → 1 → 0 是共享页释放。</text>
<rect x="33" y="119" width="229" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="47" y="152">mem_map[i] = 0</text><text class="detail" x="47" y="179">该物理页可分配</text>
<path d="M262 163L304 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="307" y="119" width="284" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="321" y="152">get_free_page()</text><text class="detail" x="321" y="179">置 1；返回 4KiB 零页</text>
<path d="M591 163L634 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="637" y="119" width="288" height="86" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="651" y="152">mem_map[i] = 1</text><text class="detail" x="651" y="179">页已分配，通常单引用</text>
<path d="M785 205V251H464V268" stroke="#7164aa" stroke-width="3" fill="none" marker-end="url(#violet)"/>
<rect x="293" y="270" width="341" height="91" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="307" y="303">fork() 共享页面</text><text class="detail" x="307" y="330">mem_map 由 1 增至 2</text>
<text x="38" y="415" class="detail">free_page(共享页) 使 2→1；再次释放 1→0。释放未分配页会 panic。</text></svg>
