<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">初始化顺序是有依赖的</title><desc id="chart-desc">Linux 0.11 main 函数初始化内存、异常、设备、调度和缓冲区后才打开中断并进入用户态</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">init/main.c：先准备响应环境，再开启中断</text><text x="34" y="78" class="detail">中断关闭的区间包含驱动、调度器与门表安装；sti() 是清晰的时间分界。</text>
<rect x="40" y="119" width="184" height="86" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="54" y="150" class="node">内存边界</text><text x="54" y="175" class="detail">EXT_MEM_K → 16MiB</text>
<path d="M224 162L248 162" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="248" y="119" width="196" height="86" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="262" y="150" class="node">基础子系统</text><text x="262" y="175" class="detail">mem/traps/blk/chr</text>
<path d="M444 162L468 162" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="468" y="119" width="207" height="86" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="482" y="150" class="node">时钟和调度</text><text x="482" y="175" class="detail">tty/time/sched</text>
<path d="M675 162L699 162" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="699" y="119" width="224" height="86" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="713" y="150" class="node">缓存与驱动</text><text x="713" y="175" class="detail">buffer/hd/floppy</text>
<path d="M820 205V253H167V288" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="40" y="289" width="255" height="86" rx="11" fill="#fff1eb" stroke="#bf6c48" stroke-width="1.7"/><text x="54" y="320" class="node">sti()</text><text x="54" y="345" class="detail">现在才允许可屏蔽 IRQ</text><path d="M295 332L321 332" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="321" y="289" width="264" height="86" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="335" y="320" class="node">move_to_user_mode</text><text x="335" y="345" class="detail">构造 iret 用户态帧</text><path d="M585 332L611 332" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="611" y="289" width="311" height="86" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="625" y="320" class="node">fork()</text><text x="625" y="345" class="detail">父 task 0 / 子 task 1</text>
<text x="40" y="420" class="detail">注意：RAMDISK 宏开启时，内存边界与初始化链中还有可选 rd_init()。</text></svg>
