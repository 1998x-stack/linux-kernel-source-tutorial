<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">0.11 时钟中断下 counter 与调度触发分支</title><desc id="chart-desc">时钟中断递增 jiffies 后调用 do_timer；counter 递减至非正时清零，若 CPL 0 则暂不调度，若 CPL 非零则 schedule</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">时钟滴答并不保证每 10ms 都切换进程</text><text x="34" y="78" class="detail">HZ=100 表示一个 tick 为 10ms，时间片用尽且被中断的是用户态时才直接调度。</text>
<rect x="33" y="115" width="211" height="95" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="47" y="146" class="node">IRQ0 / HZ=100</text><text x="47" y="171" class="detail">timer_interrupt: ++jiffies</text><path d="M244 164L269 164" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="270" y="115" width="210" height="95" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="284" y="146" class="node">do_timer(cpl)</text><text x="284" y="171" class="detail">--counter 后判定</text>
<path d="M480 163H522V120H539" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<path d="M480 163H522V291H539" stroke="#bf6c48" stroke-width="2.5" fill="none" marker-end="url(#warm)"/>
<rect x="540" y="92" width="364" height="94" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="554" y="123" class="node">counter &gt; 0</text><text x="554" y="148" class="detail">直接返回，当前任务继续</text>
<rect x="540" y="262" width="364" height="107" rx="11" fill="#fff1eb" stroke="#bf6c48" stroke-width="1.7"/><text x="554" y="293" class="node">counter ≤ 0</text><text x="554" y="318" class="detail">置 0；CPL=0 返回，CPL≠0 调用 schedule</text>
<rect x="33" y="263" width="448" height="107" rx="11" class="band"/>
<text x="52" y="298" class="em">什么叫“不可抢占内核”？</text>
<text x="52" y="327" class="detail">仅本版的时钟中断路径不在 CPL=0</text>
<text x="52" y="350" class="detail">时直接调度；阻塞操作仍可主动 schedule。</text>
<text x="33" y="426" class="mini">注意：jiffies 的加一不在 do_timer 的 C 函数体里，而在 system_call.s 的定时器入口。</text></svg>
