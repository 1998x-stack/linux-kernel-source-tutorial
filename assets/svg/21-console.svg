<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">控制台不是 printf：VRAM、游标与滚屏协同</title><desc id="svg-desc">con_init 读取 setup.s 保存的 BIOS 视频信息；con_write 解析控制字符和一部分 VT102/CSI 序列。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b75e3f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.sub{font-size:14px;fill:#647879}.node{font-size:16px;font-weight:720}.detail{font-size:13px;fill:#566c70}.tiny{font-size:11.5px;fill:#6a7d7f}.line{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#arr)}.warnline{fill:none;stroke:#b75e3f;stroke-width:2.5;marker-end:url(#warn)}.teal{fill:#eef8f5;stroke:#147f80;stroke-width:1.6}.sand{fill:#fff4ed;stroke:#b75e3f;stroke-width:1.6}.slate{fill:#f2f5f6;stroke:#789094;stroke-width:1.4}</style><rect width="960" height="480" rx="16" fill="#fffdfa"/><text x="30" y="43" class="title">控制台不是 printf：VRAM、游标与滚屏协同</text><text x="30" y="69" class="sub">con_init 读取 setup.s 保存的 BIOS 视频信息；con_write 解析控制字符和一部分 VT102/CSI 序列。</text>
<rect x="34" y="112" width="194" height="80" rx="12" class="teal"/><text x="48" y="139" class="node">BIOS / setup.s</text><text x="48" y="161" class="detail">0x90000 区域的视频参数</text>
<path d="M228 151L260 151" class="line"/>
<rect x="264" y="112" width="208" height="80" rx="12" class="teal"/><text x="278" y="139" class="node">con_init()</text><text x="278" y="161" class="detail">列数、模式、页号、显存范围</text>
<path d="M472 151L505 151" class="line"/>
<rect x="509" y="112" width="198" height="80" rx="12" class="teal"/><text x="523" y="139" class="node">VRAM base</text><text x="523" y="161" class="detail">彩色 0xB8000 / 单色 0xB0000</text>
<path d="M707 151L740 151" class="line"/>
<rect x="744" y="112" width="184" height="80" rx="12" class="teal"/><text x="758" y="139" class="node">origin / pos</text><text x="758" y="161" class="detail">行列 → 字节偏移</text>
<rect x="36" y="267" width="260" height="89" rx="12" class="teal"/><text x="50" y="294" class="node">字符单元：2 字节</text><text x="50" y="316" class="detail">低字节字符；高字节属性</text>
<rect x="350" y="267" width="260" height="89" rx="12" class="teal"/><text x="364" y="294" class="node">CRTC 游标寄存器</text><text x="364" y="316" class="detail">索引 14/15 → 当前光标位置</text>
<rect x="665" y="267" width="260" height="89" rx="12" class="teal"/><text x="679" y="294" class="node">滚屏与显示起点</text><text x="679" y="316" class="detail">寄存器 12/13；EGA/VGA 可移动 origin</text>
<path d="M296 310L346 310" class="line"/>
<path d="M610 310L661 310" class="line"/>
<text x="38" y="408" class="node">pos = origin + y × video_size_row + 2 × x</text>
<text x="38" y="438" class="detail">scrup()：EGA/VGA 整屏滚动优先移动 origin；回绕或其他显示类型时复制/擦除显存。</text>
<text x="38" y="463" class="tiny">控制台宽度来自 BIOS；25 行是该版本代码设定，不应把 80×25 写成所有模式的固定事实。</text></svg>
