<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Linux 0.11 RAM Disk 请求处理</title><desc id="d">ll_rw_block 将请求排入 blk_dev major 1 队列，request_fn 调用 do_rd_request，按 sector 与 nr_sectors 计算字节区间，执行 memcpy 后 end_request。</desc><defs><marker id="m28b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.box{fill:#fff;stroke:#147f80;stroke-width:2}.warm{fill:#fff4eb;stroke:#c46848;stroke-width:2}.vio{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.arr{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#m28b)}.ink{fill:#203035;font:700 17px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.mono{fill:#147f80;font:700 13px ui-monospace,monospace}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">从 buffer_head 到内存复制：没有硬件中断</text><rect class="box" x="35" y="105" width="185" height="100" rx="12"/><text class="ink" x="58" y="140">ll_rw_block()</text><text class="small" x="58" y="170">构造 request</text><text class="small" x="58" y="190">sector / nr_sectors</text><path class="arr" d="M220 155H285"/><rect class="box" x="285" y="105" width="185" height="100" rx="12"/><text class="ink" x="310" y="140">blk_dev[1]</text><text class="small" x="310" y="170">current_request</text><text class="small" x="310" y="190">request_fn()</text><path class="arr" d="M470 155H535"/><rect class="warm" x="535" y="105" width="185" height="100" rx="12"/><text class="ink" x="560" y="140">do_rd_request()</text><text class="small" x="560" y="170">INIT_REQUEST</text><text class="small" x="560" y="190">检查 minor / 范围</text><path class="arr" d="M720 155H785"/><rect class="vio" x="785" y="105" width="140" height="100" rx="12"/><text class="ink" x="805" y="140">memcpy()</text><text class="small" x="805" y="170">READ / WRITE</text><text class="small" x="805" y="190">end_request()</text><rect class="box" x="95" y="270" width="770" height="125" rx="14"/><text class="ink" x="125" y="308">字节地址计算</text><text class="mono" x="125" y="345">offset = sector &lt;&lt; 9</text><text class="mono" x="470" y="345">length = nr_sectors &lt;&lt; 9</text><text class="small" x="125" y="375">512B sector 单位 → 字节偏移 / 长度；1KiB filesystem block = 2 sectors</text><text class="small" x="35" y="445">end_request(1) 更新 buffer 状态、解锁并唤醒等待者；失败请求走 end_request(0)。</text></svg>