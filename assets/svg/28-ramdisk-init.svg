<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">Linux 0.11 RAM Disk 启动期内存预留</title><desc id="d">RAMDISK 宏进入编译器，init/main.c 计算 main_memory_start 并调用 rd_init，rd_init 设置 rd_start 和 rd_length、清零区域并注册 request_fn，mem_init 从预留区之后开始。</desc><defs><marker id="m28a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.box{fill:#fff;stroke:#147f80;stroke-width:2}.warm{fill:#fff4eb;stroke:#c46848;stroke-width:2}.vio{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.arr{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#m28a)}.ink{fill:#203035;font:700 18px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.mono{fill:#147f80;font:700 13px ui-monospace,monospace}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">RAM Disk 的“分配”发生在启动期：预留一段连续物理内存</text><rect class="box" x="35" y="100" width="185" height="90" rx="12"/><text class="mono" x="58" y="130">Makefile</text><text class="ink" x="58" y="160">-DRAMDISK=512</text><text class="small" x="58" y="180">512 KiB</text><path class="arr" d="M220 145H285"/><rect class="box" x="285" y="100" width="190" height="90" rx="12"/><text class="mono" x="308" y="130">init/main.c</text><text class="ink" x="308" y="160">rd_init(start,len)</text><text class="small" x="308" y="180">len = 512 × 1024</text><path class="arr" d="M475 145H540"/><rect class="warm" x="540" y="100" width="185" height="90" rx="12"/><text class="mono" x="562" y="130">ramdisk.c</text><text class="ink" x="562" y="160">rd_start / rd_length</text><text class="small" x="562" y="180">清零 + 注册请求回调</text><path class="arr" d="M725 145H790"/><rect class="vio" x="790" y="100" width="135" height="90" rx="12"/><text class="ink" x="812" y="145">mem_init()</text><text class="small" x="812" y="170">从后续地址</text><rect class="box" x="60" y="275" width="840" height="125" rx="14"/><text class="ink" x="85" y="310">物理内存布局（示意）</text><rect x="90" y="330" width="210" height="45" fill="#dcefed" stroke="#147f80"/><rect x="300" y="330" width="210" height="45" fill="#f4f1ff" stroke="#7461ba"/><rect x="510" y="330" width="360" height="45" fill="#fff4eb" stroke="#c46848"/><text class="small" x="133" y="358">buffer cache</text><text class="small" x="345" y="358">RAM Disk reserved</text><text class="small" x="602" y="358">普通页分配区</text><text class="small" x="60" y="444">rd_init 返回预留长度；main_memory_start 向后移动，mem_init 不会把这段 RAM Disk 当作空闲页。</text></svg>