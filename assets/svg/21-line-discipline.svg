<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">copy_to_cooked 的行规程分支</title><desc id="desc">从 read_q 取出一个字符后，按 ICANON、ISIG、ECHO 等 termios 标志判断：回车转换、退格删字符、Ctrl-C 发送 SIGINT、普通字符回显并放入 secondary</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="amber" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b07a1f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="440" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">一个字符进入 secondary 之前的判断顺序</text><text x="30" y="76" class="detail">while (!EMPTY(read_q) &amp;&amp; !FULL(secondary))：每次取一个字符 c = GETCH(read_q)。</text>
<rect x="30" y="100" width="200" height="60" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="137">取字符 GETCH(read_q)</text>
<rect x="300" y="100" width="240" height="60" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="316" y="130">回车/换行转换</text><text class="detail" x="316" y="150">ICRNL：13→10；INLCR：10→13</text>
<path d="M230 130H296" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="610" y="100" width="320" height="60" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="626" y="130">ICANON 行编辑分支</text><text class="detail" x="626" y="150">KILL_CHAR 删整行；ERASE_CHAR 删一字符，并回显退格</text>
<path d="M540 130H606" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/>
<rect x="610" y="185" width="320" height="58" rx="12" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="626" y="212">ISIG：INTR/QUIT 交给 tty_intr</text><text class="detail" x="626" y="232">Ctrl-C → INTMASK；Ctrl-\ → QUITMASK，字符不入队</text>
<path d="M770 160V181" fill="none" stroke="#b07a1f" stroke-width="3" marker-end="url(#amber)"/>
<rect x="610" y="268" width="320" height="58" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="626" y="295">ECHO：回显到 write_q</text><text class="detail" x="626" y="315">可见字符 PUTCH(c)；控制字符回显为 ^X</text>
<path d="M770 243V264" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/>
<rect x="300" y="268" width="240" height="58" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="316" y="295">PUTCH(c, secondary)</text><text class="detail" x="316" y="315">普通字符进入加工队列</text>
<path d="M606 297H544" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<rect x="30" y="268" width="200" height="58" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="295">wake_up(proc_list)</text><text class="detail" x="46" y="315">唤醒在 secondary 等待的 read</text>
<path d="M296 297H234" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#teal)"/>
<text x="30" y="375" class="mini">statistics：遇到换行或 EOF_CHAR 时 secondary.data++，tty_read 用它判断"已攒满一行"。</text>
<text x="30" y="400" class="mini">所有分支都由 termios.c_lflag / c_iflag / c_cc 决定，因此同一份代码可同时服务规范模式与原始模式。</text>
<text x="30" y="425" class="mini">Ctrl-C 不会写入 secondary；它把 INTMASK 或给前台进程组，行为不同于普通字符。</text></svg>
