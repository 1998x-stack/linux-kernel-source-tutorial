<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 用户信号栈帧具有 7 或 8 个 long</title><desc id="desc">do_signal 写 restorer 和 signum，可选 old blocked，并保存 eax ecx edx eflags old_eip</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">用户 handler 如何“返回”原程序</text><text x="30" y="79" class="detail">do_signal 修改保存的 EIP/ESP，并把恢复程序需要的数据压入用户栈。</text>
<rect x="40" y="118" width="210" height="96" rx="10" fill="#f1effa" stroke="#7164aa" stroke-width="1.5"/><text x="53" y="155" class="node">sa_restorer</text><text x="53" y="184" class="mini">32 位 long / 用户栈</text><rect x="264" y="118" width="210" height="96" rx="10" fill="#f1effa" stroke="#7164aa" stroke-width="1.5"/><text x="277" y="155" class="node">signr</text><text x="277" y="184" class="mini">32 位 long / 用户栈</text><rect x="488" y="118" width="210" height="96" rx="10" fill="#fff0e7" stroke="#bc6949" stroke-width="1.5"/><text x="501" y="155" class="node">old blocked（可选）</text><text x="501" y="184" class="mini">SA_NOMASK 为真时省略</text><rect x="712" y="118" width="210" height="96" rx="10" fill="#ecf7f4" stroke="#147f80" stroke-width="1.5"/><text x="725" y="155" class="node">eax</text><text x="725" y="184" class="mini">32 位 long / 用户栈</text><rect x="40" y="232" width="210" height="96" rx="10" fill="#ecf7f4" stroke="#147f80" stroke-width="1.5"/><text x="53" y="269" class="node">ecx</text><text x="53" y="298" class="mini">32 位 long / 用户栈</text><rect x="264" y="232" width="210" height="96" rx="10" fill="#ecf7f4" stroke="#147f80" stroke-width="1.5"/><text x="277" y="269" class="node">edx</text><text x="277" y="298" class="mini">32 位 long / 用户栈</text><rect x="488" y="232" width="210" height="96" rx="10" fill="#ecf7f4" stroke="#147f80" stroke-width="1.5"/><text x="501" y="269" class="node">eflags</text><text x="501" y="298" class="mini">32 位 long / 用户栈</text><rect x="712" y="232" width="210" height="96" rx="10" fill="#ecf7f4" stroke="#147f80" stroke-width="1.5"/><text x="725" y="269" class="node">old_eip</text><text x="725" y="298" class="mini">32 位 long / 用户栈</text>
<text x="39" y="392" class="em">SA_NOMASK：7 个 long；否则 8 个 long。</text>
<text x="39" y="421" class="detail">恢复地址由 sa_restorer 提供；这不是现代 Linux 的 rt_sigframe 或 sigreturn 布局。</text></svg>
