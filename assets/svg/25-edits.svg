<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">新增系统调用要改的四处代码</title><desc>内核侧在 kernel/sys.c 加 sys_hello，在 include/linux/sys.h 加 extern 声明并把它追加到 sys_call_table 末尾，再把 kernel/system_call.s 的 nr_system_calls 加一；用户侧在 include/unistd.h 定义 __NR_hello 并用 _syscall0 生成存根</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:14px;font-weight:720}.detail{font-size:12.5px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="450" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">一个系统调用横跨内核与用户侧，共四处</text><text x="30" y="76" class="detail">0.11 里最高的系统调用号是 71（sys_setregid），所以新调用占 72。</text>
<rect x="30" y="108" width="270" height="120" rx="13" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="46" y="136">1. kernel/sys.c</text><text class="detail" x="46" y="160">int sys_hello() { return 0; }</text><text class="mini" x="46" y="187">函数实现，返回值语义与其它 sys_ 一致</text><text class="mini" x="46" y="209">（负数表示错误码，非 -1 + errno）</text>
<rect x="330" y="108" width="290" height="120" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="346" y="136">2. include/linux/sys.h</text><text class="detail" x="346" y="160">extern int sys_hello();</text><text class="detail" x="346" y="183">并入 fn_ptr sys_call_table[]</text><text class="mini" x="346" y="209">追加在表尾，下标必须等于 72</text>
<rect x="650" y="108" width="280" height="120" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="666" y="136">3. kernel/system_call.s</text><text class="detail" x="666" y="160">nr_system_calls = 73</text><text class="mini" x="666" y="187">入口用 nr_system_calls-1 做上界检查</text><text class="mini" x="666" y="209">改小会拒绝新号，不改则越界</text>
<rect x="30" y="262" width="270" height="130" rx="13" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="290">4. include/unistd.h（用户侧）</text><text class="detail" x="46" y="314">#define __NR_hello 72</text><text class="detail" x="46" y="337">_syscall0(int, hello)</text><text class="mini" x="46" y="363">_syscall0 展开出一个含</text><text class="mini" x="46" y="383">int $0x80 的函数存根</text>
<rect x="360" y="262" width="270" height="130" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="376" y="290">运行时：入口分派</text><text class="detail" x="376" y="314">eax=72 → _sys_call_table[72]</text><text class="detail" x="376" y="337">→ sys_hello 执行</text><text class="mini" x="376" y="363">返回值经 eax 回到用户态</text>
<rect x="680" y="262" width="250" height="130" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="696" y="290">三处必须彼此一致</text><text class="detail" x="696" y="314">__NR 值 = 表下标</text><text class="detail" x="696" y="337">&lt; nr_system_calls</text><text class="mini" x="696" y="363">任一处对不上，要么进不了</text><text class="mini" x="696" y="383">sys_hello，要么分派到别的函数</text>
<path d="M300 168H326" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><path d="M620 168H646" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M165 228V258" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M300 327H356" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M630 327H676" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/></svg>
