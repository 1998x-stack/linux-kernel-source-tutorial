<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Linux 0.11 的硬件任务切换</title><desc id="chart-desc">switch_to 宏选择 GDT 中目标 TSS 描述符并 ljmp，CPU 保存旧任务状态并载入新任务寄存器</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">一条 ljmp，跨越两个 TSS</text><text x="34" y="78" class="detail">这是 Linux 0.11 使用的 386 硬件任务切换，不是现代内核上下文切换实现。</text>
<rect x="37" y="117" width="264" height="93" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="51" y="148" class="node">当前 task A</text><text x="51" y="173" class="detail">current 指向任务结构</text>
<path d="M301 162L331 162" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="333" y="117" width="293" height="93" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="347" y="148" class="node">switch_to(next)</text><text x="347" y="173" class="detail">检查 current，生成 TSS selector</text>
<path d="M626 162L656 162" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="657" y="117" width="264" height="93" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="671" y="148" class="node">目标 task B</text><text x="671" y="173" class="detail">GDT[n] 的 TSS 描述符</text>
<path d="M789 210V258H171V279" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="37" y="281" width="393" height="90" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="51" y="312" class="node">CPU 硬件保存 A 的状态</text><text x="51" y="337" class="detail">旧 TSS、TR 等任务状态</text>
<path d="M430 325L469 325" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="470" y="281" width="451" height="90" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="484" y="312" class="node">CPU 从 B 的 TSS 恢复执行状态</text><text x="484" y="337" class="detail">包含 EIP/ESP/段寄存器/CR3 等</text>
<text x="37" y="426" class="detail">每个任务有 TSS+LDT；ring3 → ring0 的栈切换也依赖当前 TSS 的 SS0 / ESP0。</text></svg>
