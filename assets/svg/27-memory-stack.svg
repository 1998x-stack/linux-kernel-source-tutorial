<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>现代内存分配层次</title><desc>Buddy 管理物理页块，SLUB 在页中组织同类小对象缓存</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="40" y="46">从物理页到内核对象</text>
<rect class="panel" x="330" y="82" width="300" height="72" rx="14"/><text class="label" x="480" y="113" text-anchor="middle">申请对象</text><text class="small" x="480" y="139" text-anchor="middle">kmalloc / kmem_cache_alloc</text>
<rect class="teal" x="330" y="205" width="300" height="72" rx="14"/><text class="label" x="480" y="236" text-anchor="middle">SLUB object cache</text><text class="small" x="480" y="262" text-anchor="middle">freelist · slab · object</text>
<rect class="gold" x="330" y="328" width="300" height="72" rx="14"/><text class="label" x="480" y="359" text-anchor="middle">Buddy page allocator</text><text class="small" x="480" y="385" text-anchor="middle">zone · order · free_area</text>
<path class="line" d="M480 154V195"/><path class="line" d="M480 277V318"/>
<rect class="violet" x="55" y="205" width="210" height="72" rx="14"/><text class="label" x="160" y="236" text-anchor="middle">cache A</text><text class="small" x="160" y="262" text-anchor="middle">inode / dentry</text>
<rect class="rose" x="695" y="205" width="210" height="72" rx="14"/><text class="label" x="800" y="236" text-anchor="middle">cache B</text><text class="small" x="800" y="262" text-anchor="middle">task / net object</text>
<path class="line" d="M330 241H275"/><path class="line" d="M630 241H685"/>
<text class="small" x="480" y="438" text-anchor="middle">SLUB 复用对象；Buddy 负责提供和回收底层连续物理页块</text></svg>