<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">shell 的管道由 fork、dup、close、execve 串接</title><desc id="svg-desc">pipe 的两个 fd 需要在子进程中连接到标准输入/输出；不正确关闭写端可能阻止 EOF。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:12px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">shell 的管道由 fork、dup、close、execve 串接</text><text x="30" y="71" class="subtitle">pipe 的两个 fd 需要在子进程中连接到标准输入/输出；不正确关闭写端可能阻止 EOF。</text>
<rect x="37" y="117" width="223" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="51" y="147" class="node">父 shell</text><text x="51" y="171" class="detail">sys_pipe() → fd[0], fd[1]</text>
<path d="M260 162H312V124H351" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M312 162V267H351" fill="none" stroke="#ba6543" stroke-width="2.5" marker-end="url(#b)"/>
<rect x="357" y="101" width="279" height="88" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="371" y="131" class="node">写端子任务</text><text x="371" y="155" class="detail">dup(fd[1] → 1); exec(ls)</text>
<rect x="357" y="253" width="279" height="88" rx="12" fill="#fff4ee" stroke="#ba6543" stroke-width="1.6"/><text x="371" y="283" class="node">读端子任务</text><text x="371" y="307" class="detail">dup(fd[0] → 0); exec(grep)</text>
<rect x="674" y="180" width="246" height="88" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="688" y="210" class="node">close 未使用 fd</text><text x="688" y="234" class="detail">所有写端关闭后才能 EOF</text>
<text x="38" y="410" class="detail">命令和 PID 仅为演示；这套 fd 连接是 shell 用户态编排，不是 sys_pipe 自动执行 dup/execve。</text></svg>
