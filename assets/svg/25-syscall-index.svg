<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">新增系统调用的编号边界：72 个旧入口变成 73 个</title><desc id="svg-desc">现有编号为 0…71；增加 72 后，汇编边界必须允许 EAX=72，即 nr_system_calls=73。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b75e3f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.sub{font-size:14px;fill:#647879}.node{font-size:16px;font-weight:720}.detail{font-size:13px;fill:#566c70}.tiny{font-size:11.5px;fill:#6a7d7f}.line{fill:none;stroke:#147f80;stroke-width:2.5;marker-end:url(#arr)}.warnline{fill:none;stroke:#b75e3f;stroke-width:2.5;marker-end:url(#warn)}.teal{fill:#eef8f5;stroke:#147f80;stroke-width:1.6}.sand{fill:#fff4ed;stroke:#b75e3f;stroke-width:1.6}.slate{fill:#f2f5f6;stroke:#789094;stroke-width:1.4}</style><rect width="960" height="470" rx="16" fill="#fffdfa"/><text x="30" y="43" class="title">新增系统调用的编号边界：72 个旧入口变成 73 个</text><text x="30" y="69" class="sub">现有编号为 0…71；增加 72 后，汇编边界必须允许 EAX=72，即 nr_system_calls=73。</text>
<rect x="36" y="115" width="250" height="93" rx="12" class="teal"/><text x="50" y="142" class="node">旧表：72 项</text><text x="50" y="164" class="detail">索引 0 … 71</text>
<path d="M286 161L335 161" class="line"/>
<rect x="339" y="115" width="250" height="93" rx="12" class="sand"/><text x="353" y="142" class="node">追加第 73 项</text><text x="353" y="164" class="detail">索引 72 = sys_hello</text>
<path d="M589 161L638 161" class="line"/>
<rect x="642" y="115" width="280" height="93" rx="12" class="teal"/><text x="656" y="142" class="node">边界常量</text><text x="656" y="164" class="detail">nr_system_calls = 73</text>
<rect x="36" y="275" width="886" height="70" rx="10" fill="#f2f5f6" stroke="#789094" stroke-width="1.4"/>
<text x="56" y="302" class="node">EAX</text><text x="160" y="302" class="node">0…71</text><text x="322" y="302" class="node">72</text><text x="432" y="302" class="node">73 或更大</text>
<text x="56" y="328" class="detail">旧系统调用</text><text x="160" y="328" class="detail">原有索引</text><text x="322" y="328" class="detail">新入口</text><text x="432" y="328" class="detail">拒绝 / bad_sys_call</text>
<text x="37" y="400" class="detail">system_call.s 检查：cmp $nr_system_calls-1, %eax；ja bad_sys_call。</text>
<text x="37" y="431" class="tiny">NR_syscalls 不是本版本 unistd.h 的宏；不要把现代 Linux 的 syscall table 生成机制搬进 0.11。</text></svg>
