<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>Linux 0.11 RAM Disk 数据路径</title><desc>启动阶段预留 RAM disk 内存，注册 major 1 request_fn，块请求进入 do_rd_request；rd_load 可选地从软盘加载 rootfs</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="470" rx="20"/>
<text class="head" x="40" y="42">Boot-time reservation → block request → memory copy</text>
<rect class="gold" x="40" y="90" width="205" height="76" rx="14"/><text class="label" x="142.5" y="121" text-anchor="middle">init/main.c</text><text class="small" x="142.5" y="147" text-anchor="middle">RAMDISK * 1024</text>
<rect class="teal" x="285" y="90" width="205" height="76" rx="14"/><text class="label" x="387.5" y="121" text-anchor="middle">rd_init()</text><text class="small" x="387.5" y="147" text-anchor="middle">rd_start / rd_length</text>
<rect class="panel" x="530" y="90" width="205" height="76" rx="14"/><text class="label" x="632.5" y="121" text-anchor="middle">blk_dev[1]</text><text class="small" x="632.5" y="147" text-anchor="middle">request_fn = do_rd_request</text>
<rect class="violet" x="775" y="90" width="145" height="76" rx="14"/><text class="label" x="847.5" y="121" text-anchor="middle">block queue</text><text class="small" x="847.5" y="147" text-anchor="middle">major 1</text>
<path class="line" d="M245 128H275"/><path class="line" d="M490 128H520"/><path class="line" d="M735 128H765"/>
<rect class="teal" x="285" y="245" width="205" height="82" rx="14"/><text class="label" x="387.5" y="276" text-anchor="middle">do_rd_request()</text><text class="small" x="387.5" y="302" text-anchor="middle">sector / nr_sectors / buffer</text>
<rect class="gold" x="530" y="245" width="205" height="82" rx="14"/><text class="label" x="632.5" y="276" text-anchor="middle">memcpy()</text><text class="small" x="632.5" y="302" text-anchor="middle">READ ↔ WRITE</text>
<rect class="panel" x="775" y="245" width="145" height="82" rx="14"/><text class="label" x="847.5" y="276" text-anchor="middle">end_request()</text><text class="small" x="847.5" y="302" text-anchor="middle">wake waiters</text>
<path class="line" d="M847 166V225H388V235"/><path class="line" d="M490 286H520"/><path class="line" d="M735 286H765"/>
<rect class="violet" x="40" y="365" width="250" height="76" rx="14"/><text class="label" x="165" y="396" text-anchor="middle">rd_load() (optional)</text><text class="small" x="165" y="422" text-anchor="middle">floppy block 256 → ram1</text>
<path class="dash" d="M165 365V330H285"/>
<text class="small" x="610" y="405" text-anchor="middle">rd_load 成功后 ROOT_DEV = 0x0101（major 1, minor 1）</text></svg>