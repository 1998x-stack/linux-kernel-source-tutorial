<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">ramdisk 驱动的请求闭环</title><desc>块设备层把请求交给 do_rd_request；INIT_REQUEST 取出当前请求，按 sector&lt;&lt;9 算出内存地址，READ 从内存拷到缓冲、WRITE 从缓冲拷到内存，然后 end_request 并处理下一个请求</desc><defs><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:13px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="410" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">一个最小块设备驱动：把扇区号翻译成内存偏移</text><text x="30" y="76" class="detail">ramdisk 早在 0.11 里就存在（Theodore Ts'o 1991 年编写）；它是学习驱动闭环的现成范例。</text>
<rect x="30" y="108" width="200" height="72" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="136">ll_rw_blk 请求队列</text><text class="detail" x="46" y="160">request[NR_REQUEST]</text>
<rect x="275" y="108" width="215" height="72" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="291" y="136">do_rd_request</text><text class="detail" x="291" y="160">INIT_REQUEST 取 CURRENT</text>
<rect x="535" y="108" width="200" height="72" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="551" y="136">算地址与长度</text><text class="detail" x="551" y="160">rd_start+(sector&lt;&lt;9)</text>
<rect x="780" y="108" width="150" height="72" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="796" y="136">memcpy</text><text class="detail" x="796" y="160">READ / WRITE</text>
<path d="M230 144H271" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#violet)"/><path d="M490 144H531" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M735 144H776" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/>
<rect x="30" y="215" width="430" height="150" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="48" y="243">真实源码关键语句（摘取）</text><text class="mini" x="48" y="270">addr = rd_start + (CURRENT-&gt;sector &lt;&lt; 9);</text><text class="mini" x="48" y="292">len = CURRENT-&gt;nr_sectors &lt;&lt; 9;</text><text class="mini" x="48" y="314">READ: memcpy(CURRENT-&gt;buffer, addr, len);</text><text class="mini" x="48" y="336">WRITE: memcpy(addr, CURRENT-&gt;buffer, len);</text><text class="mini" x="48" y="358">end_request(1); goto repeat;</text>
<rect x="490" y="215" width="440" height="150" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="508" y="243">为什么这是好范例</text><text class="detail" x="508" y="270">它把“设备 I/O”退化成一次内存拷贝，</text><text class="detail" x="508" y="294">于是你可以专注在块设备接口本身：</text><text class="mini" x="508" y="322">INIT_REQUEST / CURRENT / end_request / repeat</text><text class="mini" x="508" y="346">以及 sector&lt;&lt;9 这种“扇区到字节”的换算</text></svg>
