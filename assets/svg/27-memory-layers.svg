<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="t d"><title id="t">内核内存分配的层次</title><desc id="d">0.11 mem_map 与 get_free_page 对照现代 zone、per-CPU pageset、buddy order 和上层 SLUB 对象缓存。</desc><defs><marker id="m27a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker></defs><style>.bg{fill:#fbfdfc}.old{fill:#fff5ed;stroke:#c46848;stroke-width:2}.page{fill:#e7f3f1;stroke:#147f80;stroke-width:2}.obj{fill:#f4f1ff;stroke:#7461ba;stroke-width:2}.arr{stroke:#147f80;stroke-width:2.5;fill:none;marker-end:url(#m27a)}.ink{fill:#203035;font:700 18px system-ui,'Microsoft YaHei',sans-serif}.small{fill:#53676d;font:14px system-ui,'Microsoft YaHei',sans-serif}.mono{fill:#147f80;font:700 13px ui-monospace,monospace}</style><rect class="bg" width="960" height="480" rx="18"/><text class="ink" x="35" y="42">两层分配问题：先取物理页，再把页切成对象</text><rect class="old" x="35" y="95" width="230" height="300" rx="14"/><text class="mono" x="58" y="128">LINUX 0.11</text><text class="ink" x="58" y="165">mem_map[]</text><text class="small" x="58" y="191">每页使用计数</text><g fill="#f0c6ae" stroke="#c46848"><rect x="60" y="222" width="34" height="34"/><rect x="98" y="222" width="34" height="34"/><rect x="136" y="222" width="34" height="34"/><rect x="174" y="222" width="34" height="34"/><rect x="212" y="222" width="34" height="34"/></g><text class="small" x="58" y="286">get_free_page()</text><text class="small" x="58" y="312">扫描空闲页</text><text class="small" x="58" y="356">一次返回 4KiB 页</text><path class="arr" d="M265 245H335"/><rect class="page" x="335" y="95" width="285" height="300" rx="14"/><text class="mono" x="358" y="128">MODERN PAGE ALLOCATOR</text><text class="ink" x="358" y="165">node / zone / PCP</text><text class="small" x="358" y="191">先走本 CPU 页缓存，再回退</text><g stroke="#147f80" stroke-width="1.5"><rect x="360" y="222" width="230" height="35" rx="6" fill="#d8ece8"/><rect x="360" y="265" width="110" height="35" rx="6" fill="#d8ece8"/><rect x="480" y="265" width="110" height="35" rx="6" fill="#d8ece8"/></g><text class="small" x="385" y="245">order 2 = 4 pages</text><text class="small" x="383" y="288">order 1</text><text class="small" x="502" y="288">order 1</text><text class="small" x="358" y="344">split / coalesce buddy blocks</text><path class="arr" d="M620 245H690"/><rect class="obj" x="690" y="95" width="235" height="300" rx="14"/><text class="mono" x="713" y="128">OBJECT ALLOCATOR</text><text class="ink" x="713" y="165">SLUB cache</text><text class="small" x="713" y="191">从页中切分同类对象</text><g fill="#ddd6f5" stroke="#7461ba"><rect x="716" y="222" width="54" height="46" rx="5"/><rect x="778" y="222" width="54" height="46" rx="5"/><rect x="840" y="222" width="54" height="46" rx="5"/><rect x="716" y="278" width="54" height="46" rx="5"/><rect x="778" y="278" width="54" height="46" rx="5"/><rect x="840" y="278" width="54" height="46" rx="5"/></g><text class="small" x="713" y="356">kmem_cache / kmalloc</text><text class="small" x="35" y="444">buddy 管连续物理页块；SLUB 管页内对象缓存。两者协作，不是互相替代。</text></svg>