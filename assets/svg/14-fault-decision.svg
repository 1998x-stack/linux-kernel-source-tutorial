<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">Linux 0.11 的页故障分支</title><desc id="desc">page.s 读取 CR2 与错误码；present=0 进入 do_no_page；present=1 的写保护错误进入 do_wp_page</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">缺页并不只有“分配新页”一种答案</text><text x="30" y="79" class="detail">CR2 是故障线性地址，错误码 bit0 决定 v0.11 走哪类处理。</text>
<rect x="33" y="121" width="246" height="97" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="47" y="154">CPU 产生 #PF</text><text class="detail" x="47" y="181">CR2 + error_code</text>
<path d="M279 170L308 170" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="310" y="121" width="284" height="97" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="324" y="154">mm/page.s</text><text class="detail" x="324" y="181">保存现场并判断 bit0</text>
<path d="M594 170H640V114H661" stroke="#147f80" stroke-width="3" fill="none" marker-end="url(#teal)"/>
<path d="M594 170H640V282H661" stroke="#bc6949" stroke-width="3" fill="none" marker-end="url(#warm)"/>
<rect x="663" y="99" width="266" height="100" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="677" y="132">P = 0：do_no_page</text><text class="detail" x="677" y="159">共享 / 文件装入 / 零页</text>
<rect x="663" y="267" width="266" height="99" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="677" y="300">P = 1：do_wp_page</text><text class="detail" x="677" y="327">单引用解写保护或复制</text>
<rect x="34" y="287" width="548" height="85" rx="11" fill="#f2f0fa" stroke="#7164aa"/>
<text x="51" y="317" class="node">每个处理器故障都要先查权限和上下文</text>
<text x="51" y="347" class="detail">bit0=1 但不一定能泛化为任意写入场景。</text>
<text x="34" y="422" class="detail">该分支依赖 0.11 特定 page.s；不要与现代内核的完整 fault flags 系统混淆。</text></svg>
