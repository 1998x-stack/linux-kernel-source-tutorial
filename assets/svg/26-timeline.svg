<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img"><title>Linux 0.11 到 1.0 版本时间线</title><desc>六个版本节点：需求调页、磁盘交换、VFS、TCP/IP、NFS 与用户地址空间变化</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55716d"/></marker><style>.bg{fill:#f7f5ef}.panel{fill:#fff;stroke:#d8ded8;stroke-width:1.5}.ink{fill:#20312f}.muted{fill:#647570}.teal{fill:#e1f2ee;stroke:#3c8e7f;stroke-width:2}.gold{fill:#fff1d5;stroke:#c28a32;stroke-width:2}.rose{fill:#f9e8e3;stroke:#b96a56;stroke-width:2}.violet{fill:#eee9fb;stroke:#8172b5;stroke-width:2}.line{stroke:#55716d;stroke-width:2.5;fill:none;marker-end:url(#arr)}.dash{stroke:#9b7770;stroke-width:2;stroke-dasharray:7 6;fill:none}.head{font:700 22px sans-serif;fill:#20312f}.label{font:600 17px sans-serif;fill:#20312f}.small{font:14px sans-serif;fill:#52645f}.tiny{font:12px sans-serif;fill:#647570}.tag{font:700 13px sans-serif;fill:#28776b}</style></defs><rect class="bg" x="0" y="0" width="960" height="480" rx="20"/>
<text class="head" x="40" y="48">源码里程碑（不是“版本号 = 功能全部成熟”）</text>
<line class="line" x1="92" y1="242" x2="872" y2="242"/>
<circle cx="95" cy="242" r="10" fill="#3c8e7f"/><text class="tag" x="95" y="190" text-anchor="middle">0.11</text><rect class="panel" x="32" y="82" width="126" height="78" rx="12"/><text class="label" x="95" y="112" text-anchor="middle">需求调页</text><text class="tiny" x="95" y="137" text-anchor="middle">文件页按需装入</text><text class="small" x="95" y="286" text-anchor="middle">基线</text><circle cx="248" cy="242" r="10" fill="#b96a56"/><text class="tag" x="248" y="190" text-anchor="middle">0.12</text><rect class="gold" x="185" y="82" width="126" height="78" rx="12"/><text class="label" x="248" y="112" text-anchor="middle">swap</text><text class="tiny" x="248" y="137" text-anchor="middle">swap_out / swap_in</text><text class="small" x="248" y="286" text-anchor="middle">源码证据</text><circle cx="401" cy="242" r="10" fill="#3c8e7f"/><text class="tag" x="401" y="190" text-anchor="middle">0.95</text><rect class="panel" x="338" y="82" width="126" height="78" rx="12"/><text class="label" x="401" y="112" text-anchor="middle">早期 VFS</text><text class="tiny" x="401" y="137" text-anchor="middle">接口仍未完整</text><text class="small" x="401" y="286" text-anchor="middle">源码证据</text><circle cx="554" cy="242" r="10" fill="#3c8e7f"/><text class="tag" x="554" y="190" text-anchor="middle">0.98</text><rect class="panel" x="491" y="82" width="126" height="78" rx="12"/><text class="label" x="554" y="112" text-anchor="middle">TCP/IP</text><text class="tiny" x="554" y="137" text-anchor="middle">代码已在树中</text><text class="small" x="554" y="286" text-anchor="middle">源码证据</text><circle cx="707" cy="242" r="10" fill="#b96a56"/><text class="tag" x="707" y="190" text-anchor="middle">0.99</text><rect class="gold" x="644" y="82" width="126" height="78" rx="12"/><text class="label" x="707" y="112" text-anchor="middle">NFS + 3GiB</text><text class="tiny" x="707" y="137" text-anchor="middle">多 FS 注册表</text><text class="small" x="707" y="286" text-anchor="middle">源码证据</text><circle cx="860" cy="242" r="10" fill="#3c8e7f"/><text class="tag" x="860" y="190" text-anchor="middle">1.0</text><rect class="panel" x="797" y="82" width="126" height="78" rx="12"/><text class="label" x="860" y="112" text-anchor="middle">VMA / vmalloc</text><text class="tiny" x="860" y="137" text-anchor="middle">稳定化发布</text><text class="small" x="860" y="286" text-anchor="middle">1.0 稳定化</text>
<rect class="rose" x="70" y="342" width="820" height="82" rx="14"/><text class="label" x="480" y="373" text-anchor="middle">审校原则</text><text class="small" x="480" y="400" text-anchor="middle">源码存在 ≠ 默认启用；能编译 ≠ 已充分测试；CPU 具备 4GiB 线性范围 ≠ 每进程 4GiB 用户空间</text></svg>