<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">从 0.11 到 1.0 的大致顺序</title><desc>按公开历史版本目录，0.11 之后依次出现 0.12、0.9x 系列与 1.0；本章只标注每个阶段要解决的方向，不逐一核对每个版本的 changelog</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:15px;font-weight:720}.detail{font-size:12.5px;fill:#53676d}.mini{font-size:13px;fill:#53676d}</style><rect width="960" height="420" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">方向可以画，版本号不能编</text><text x="30" y="76" class="detail">本节时间线来自公开历史归档；具体到“哪个版本引入哪项特性”，请以 kernel.org 发布目录为准。</text>
<line x1="60" y1="150" x2="900" y2="150" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/>
<circle cx="110" cy="150" r="8" fill="#147f80"/><circle cx="330" cy="150" r="8" fill="#147f80"/><circle cx="550" cy="150" r="8" fill="#147f80"/><circle cx="770" cy="150" r="8" fill="#147f80"/>
<text class="node" x="60" y="128">0.11</text><text class="node" x="286" y="128">0.12</text><text class="node" x="506" y="128">0.9x 系列</text><text class="node" x="726" y="128">1.0</text>
<rect x="30" y="185" width="185" height="185" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="detail" x="46" y="212">本章研究基线</text><text class="mini" x="46" y="238">按需分页</text><text class="mini" x="46" y="262">MINIX 文件系统</text><text class="mini" x="46" y="286">字符/块设备驱动</text><text class="mini" x="46" y="310">无网络</text><text class="mini" x="46" y="334">72 项系统调用</text>
<rect x="250" y="185" width="185" height="185" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="detail" x="266" y="212">补上“内存不够”</text><text class="mini" x="266" y="238">把不常用页写入磁盘</text><text class="mini" x="266" y="262">腾出物理内存</text><text class="mini" x="266" y="286">方向：交换（swap）</text><text class="mini" x="266" y="314">未核对：具体版本与实现细节</text>
<rect x="470" y="185" width="185" height="185" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="detail" x="486" y="212">补上“多种文件系统”</text><text class="mini" x="486" y="238">统一的文件操作接口</text><text class="mini" x="486" y="262">可挂载不同格式</text><text class="mini" x="486" y="286">方向：VFS 抽象层</text><text class="mini" x="486" y="314">未核对：过渡版本的时间点</text>
<rect x="690" y="185" width="240" height="185" rx="12" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="detail" x="706" y="212">补上“与外界通信”等</text><text class="mini" x="706" y="238">网络协议栈、ELF、页缓存</text><text class="mini" x="706" y="262">在 0.9x 到 1.0 之间逐步成形</text><text class="mini" x="706" y="290">到 1.0（1994-03）</text><text class="mini" x="706" y="314">已是一套可用的类 UNIX 内核</text><text class="mini" x="706" y="338">未核对：本节不下具体特性归属</text>
<text x="30" y="402" class="mini">阅读方式：把 0.11 当“能跑的最小内核”，把后续版本当它所暴露限制的解法，而不是一次性堆砌的功能清单。</text></svg>
