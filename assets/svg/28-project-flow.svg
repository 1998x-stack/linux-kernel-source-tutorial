<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">从源码到运行的完整流程</title><desc id="desc">五个阶段：定位并修改源码，用 Makefile 构建出 Image 与 System.map，把镜像写入启动盘，在模拟器中启动，最后用 printk 或调试器观察结果；本文未实际执行其中任何一步</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="amber" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b07a1f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:14px;font-weight:720}.detail{font-size:12.5px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 13px ui-monospace,Consolas,monospace}</style><rect width="960" height="410" rx="18" fill="#fffdfa"/><text x="30" y="46" class="title">把“读懂”变成“做成”：一条可复现的项目链</text><text x="30" y="76" class="detail">每一步都产出可检查的物件；只要有一环对不上，就先别进行下一步。</text>
<rect x="30" y="110" width="165" height="120" rx="12" fill="#f3f0fa" stroke="#7164aa" stroke-width="2"/><text class="node" x="46" y="140">1 定位</text><text class="detail" x="46" y="166">grep 找到入口</text><text class="mini" x="46" y="192">例：sys_write 在</text><text class="mini" x="46" y="214">fs/read_write.c</text>
<rect x="225" y="110" width="165" height="120" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="241" y="140">2 修改</text><text class="detail" x="241" y="166">改最小一处</text><text class="mini" x="241" y="192">保持与接口</text><text class="mini" x="241" y="214">约定一致</text>
<rect x="420" y="110" width="165" height="120" rx="12" fill="#fbf3ee" stroke="#bc6949" stroke-width="2"/><text class="node" x="436" y="140">3 构建</text><text class="detail" x="436" y="166">make 产出</text><text class="mini" x="436" y="192">Image 与</text><text class="mini" x="436" y="214">System.map</text>
<rect x="615" y="110" width="165" height="120" rx="12" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="631" y="140">4 启动盘</text><text class="detail" x="631" y="166">镜像写入</text><text class="mini" x="631" y="192">引导扇区与</text><text class="mini" x="631" y="214">根设备</text>
<rect x="810" y="110" width="120" height="120" rx="12" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="826" y="140">5 运行</text><text class="detail" x="826" y="166">模拟器启动</text><text class="mini" x="826" y="192">观察输出</text>
<path d="M195 170H221" fill="none" stroke="#7164aa" stroke-width="3" marker-end="url(#teal)"/><path d="M390 170H416" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><path d="M585 170H611" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#teal)"/><path d="M780 170H806" fill="none" stroke="#b07a1f" stroke-width="3" marker-end="url(#amber)"/>
<rect x="30" y="265" width="900" height="115" rx="13" fill="#fdf3e2" stroke="#b07a1f" stroke-width="2"/><text class="node" x="48" y="293">本文的诚实边界</text><text class="detail" x="48" y="320">上述 1–5 步在本次整理中均未实际执行：未修改 0.11 源码，未构建，未制作启动盘，未启动模拟器。</text><text class="detail" x="48" y="345">因此不提供任何“应该看到的输出”、截图或耗时数字。这张图只是流程骨架，是否正确要由你的真实验证回答。</text><text class="mini" x="48" y="371">当你亲手跑通后，把命令、版本与观察记进证据账本，才算真正完成一次闭环。</text></svg>
