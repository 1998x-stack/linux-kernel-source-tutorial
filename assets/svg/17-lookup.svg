<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">从路径字符串到 inode 的实际调用链</title><desc id="svg-desc">get_dir 逐级解析目录；dir_namei 拆 basename；find_entry 读目录块；iget 读目标 inode。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147f80"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ba6543"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#263d40}.title{font-size:23px;font-weight:750}.subtitle{font-size:14px;fill:#647879}.node{font-size:17px;font-weight:700}.detail{font-size:13.5px;fill:#566c70}.small{font-size:13px;fill:#697b7d}.accent{fill:#147f80}.body{font-size:15px}</style><rect width="960" height="468" rx="16" fill="#fffdfa"/><text x="30" y="45" class="title">从路径字符串到 inode 的实际调用链</text><text x="30" y="71" class="subtitle">get_dir 逐级解析目录；dir_namei 拆 basename；find_entry 读目录块；iget 读目标 inode。</text>
<rect x="40" y="113" width="184" height="91" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="54" y="143" class="node">路径输入</text><text x="54" y="167" class="detail">/usr/bin/sh</text>
<path d="M224 158L256 158" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="260" y="113" width="193" height="91" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="274" y="143" class="node">get_dir()</text><text x="274" y="167" class="detail">遍历中间目录</text>
<path d="M453 158L484 158" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="488" y="113" width="202" height="91" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="502" y="143" class="node">dir_namei()</text><text x="502" y="167" class="detail">父目录 + basename</text>
<path d="M690 158L721 158" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="724" y="113" width="200" height="91" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="738" y="143" class="node">find_entry()</text><text x="738" y="167" class="detail">目录项 inode 号</text>
<path d="M814 204V268H471V294" fill="none" stroke="#147f80" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="286" y="299" width="375" height="90" rx="12" fill="#eff8f5" stroke="#147f80" stroke-width="1.6"/><text x="300" y="329" class="node">iget(dev, inode_number)</text><text x="300" y="353" class="detail">inode_table 命中或通过 bread 读取</text>
<text x="40" y="427" class="detail">特殊分支：起点使用 current-&gt;root/pwd；.. 在挂载点或进程伪根有修正；名称最长 14 字节。</text></svg>
