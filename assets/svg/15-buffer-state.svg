<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">buffer cache 命中、磁盘读、脏页写回和释放</title><desc id="desc">getblk 先在 hash 查找；若未命中挑空闲 clean 候选，必要时 sync_dev 写回后再赋新键；bread 根据 uptodate 决定读取</desc><defs><marker id="teal" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#147f80"/></marker><marker id="warm" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bc6949"/></marker><marker id="violet" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7164aa"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:750}.node{font-size:17px;font-weight:730}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.mono{font:650 15px ui-monospace,Consolas,monospace}.em{font-size:16px;font-weight:700;fill:#126e71}</style><rect width="960" height="470" rx="18" fill="#fffdfa"/><text x="30" y="48" class="title">从 getblk 到 bread，再到 brelse</text><text x="30" y="79" class="detail">dirty、locked、refcount、uptodate 是四个不同的维度。</text>
<rect x="32" y="117" width="228" height="94" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="46" y="150">getblk(dev,block)</text><text class="detail" x="46" y="177">hash 查找已有缓存</text>
<path d="M260 163L287 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="289" y="117" width="281" height="94" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="303" y="150">命中：b_count++</text><text class="detail" x="303" y="177">等待锁并二次核对</text>
<path d="M570 163L597 163" fill="none" stroke="#147f80" stroke-width="3" marker-end="url(#teal)"/><rect x="599" y="117" width="331" height="94" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="613" y="150">bread()</text><text class="detail" x="613" y="177">uptodate? 直接用 : READ</text>
<path d="M145 211V274H440V292" stroke="#bc6949" stroke-width="3" fill="none" marker-end="url(#warm)"/>
<rect x="236" y="295" width="401" height="88" rx="13" fill="#fff1e9" stroke="#bc6949" stroke-width="2"/><text class="node" x="250" y="328">未命中：扫描 free_list</text><text class="detail" x="250" y="355">跳过 b_count&gt;0；脏块先 sync_dev</text>
<path d="M637 339L666 339" fill="none" stroke="#bc6949" stroke-width="3" marker-end="url(#warm)"/><rect x="668" y="295" width="258" height="88" rx="13" fill="#eff7f4" stroke="#147f80" stroke-width="2"/><text class="node" x="682" y="328">brelse()</text><text class="detail" x="682" y="355">等待解锁；b_count--</text>
<text x="33" y="426" class="detail">sys_sync / sync_dev 写回脏缓冲区；brelse 只是减少引用，不等于刷盘。</text></svg>
