<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">任务0与init任务的分叉</title><desc id="chart-desc">main 中 fork 发生在 user mode；父任务 pause 循环，子任务 init 运行 setup、rc 和 shell</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">一次 fork()：两个执行分支，两种职责</text><text x="34" y="78" class="detail">main() 本身运行在任务 0；第一次 fork() 的子分支调用 init()。</text>
<rect x="307" y="98" width="346" height="74" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="321" y="129" class="node">task 0 执行 main()</text><text x="321" y="154" class="detail">sti → move_to_user_mode → fork</text>
<path d="M480 172V208H235V237 M480 208H727V237" stroke="#147f80" stroke-width="2.5" fill="none"/>
<path d="M235 215V236" stroke="#147f80" stroke-width="2.5" marker-end="url(#teal")/><path d="M727 215V236" stroke="#147f80" stroke-width="2.5" marker-end="url(#teal")"/>
<rect x="61" y="239" width="352" height="93" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="75" y="270" class="node">父分支：fork() &amp;gt; 0</text><text x="75" y="295" class="detail">task 0 循环 pause()</text>
<rect x="545" y="239" width="353" height="93" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="559" y="270" class="node">子分支：fork() == 0</text><text x="559" y="295" class="detail">task 1 进入 init()</text>
<rect x="545" y="345" width="353" height="62" rx="9" fill="#f3f0fb" stroke="#6c64b2"/>
<text x="561" y="369" class="detail">setup(磁盘) → /etc/rc → shell</text><text x="561" y="392" class="mini">init() 会再 fork 出执行 rc / shell 的后代</text>
<text x="61" y="380" class="detail">task 0 是空闲兜底任务，不能睡眠等待；</text><text x="61" y="403" class="mini">pause 通过调度循环返回，不等于普通任务的等待语义。</text></svg>
