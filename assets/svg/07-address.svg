<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Linux 0.11 分段再分页</title><desc id="chart-desc">选择子低位区分 GDT 与 LDT；进程用户地址按每进程 LDT 基址生成线性地址，再走页表</desc><defs><marker id="teal" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147f80"/></marker><marker id="warm" markerWidth="9" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf6c48"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#203035}.title{font-size:23px;font-weight:760}.node{font-size:18px;font-weight:700}.detail{font-size:15px;fill:#53676d}.mini{font-size:13px;fill:#53676d}.em{font-size:16px;font-weight:720;fill:#116d70}.mono{font-size:16px;font-weight:650;font-family:ui-monospace,Consolas,monospace}.band{fill:#f3f7f6;stroke:#d7e3df}.callout{fill:#fff5ec;stroke:#cda37d}</style><rect width="960" height="460" rx="18" fill="#fffdfa"/><text x="34" y="47" class="title">虚拟地址为何不一定等于线性地址</text><text x="34" y="78" class="detail">进程 LDT 用户段基址可以是 nr × 64 MiB；而 GDT 的内核段基址为零。</text>
<rect x="34" y="120" width="205" height="104" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="48" y="151" class="node">用户逻辑地址</text><text x="48" y="176" class="detail">selector : offset</text><path d="M239 170L268 170" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="270" y="120" width="213" height="104" rx="11" fill="#f3f0fb" stroke="#6c64b2" stroke-width="1.7"/><text x="284" y="151" class="node">LDT 段描述符</text><text x="284" y="176" class="detail">base + offset</text><path d="M483 170L512 170" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/>
<rect x="514" y="120" width="189" height="104" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="528" y="151" class="node">32-bit 线性地址</text><text x="528" y="176" class="detail">10 / 10 / 12 bits</text>
<path d="M703 170L732 170" stroke="#147f80" stroke-width="2.5" fill="none" marker-end="url(#teal)"/><rect x="734" y="120" width="191" height="104" rx="11" fill="#eef8f5" stroke="#147f80" stroke-width="1.7"/><text x="748" y="151" class="node">分页映射</text><text x="748" y="176" class="detail">CR3 → PDE → PTE</text>
<rect x="34" y="275" width="892" height="126" rx="11" fill="#f2f7f6" stroke="#d7e3df"/>
<text x="54" y="307" class="em">例：第 2 个任务槽（nr = 2）</text><text x="54" y="342" class="mono">0x08000000 + 0x00001234 = 0x08001234</text><text x="54" y="369" class="detail">逻辑偏移先由 LDT 基址平移，再按线性地址查页表；例子仅展示地址计算，不指认物理页。</text>
<text x="34" y="433" class="mini">来源：kernel/fork.c copy_mem() 的 nr * 0x4000000；include/linux/sched.h 的 _LDT(n)。</text></svg>
